name: Branch cleanup

# Deletes every branch that is not ahead of main, inside GitHub with this repository's own token (R-WS-014 and
# DESIGN-28 in private-cloud-workspace): a cloud session cannot delete a branch. On a pull request it deletes nothing
# and lists what it would delete. The workflow and its rules live in the workspace.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-cleanup:
    permissions:
      contents: write
      pull-requests: read
    uses: e1-rahabok/private-cloud-workspace/.github/workflows/branch-cleanup.yml@main
