name: Cross-repo checks

# The workspace's checks across the five repositories, run with this pull request's branch in place of agent-e2's
# main (R-WS-002 in private-cloud-workspace). The workflow lives in the workspace.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo:
    uses: e1-rahabok/private-cloud-workspace/.github/workflows/cross-repo.yml@main
