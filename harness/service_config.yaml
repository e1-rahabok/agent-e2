# Agent E2 service configuration (harness/answer_service.py). The product's own config: the harness reads nothing from
# benchmark/ (harness/README.md, section 2). Retrieval and agent settings match benchmark/runner/runner_config.yaml, so the
# service runs the benchmarked pipeline; keep the two in step when a setting changes there.
gateway: https://ai-gateway.vercel.sh/v1   # demo and lab: Vercel AI Gateway (key from env AI_GATEWAY_API_KEY). Customer site: the local model server's URL
model: google/gemma-4-31b-it               # one of the local candidates (benchmark/models.md); the model the gateway benchmark chooses replaces it
model_params:
  google/gemma-4-31b-it: {}
sampling:
  google/gemma-4-31b-it: {temperature: 1.0, top_p: 0.95, top_k: 64}
temperature: null
gateway_retry_minutes: 1
max_tokens: 4000
embedding_model: alibaba/qwen3-embedding-0.6b   # null = BM25 only
search_k: 10
context_tokens: 32000
plan_section_tokens: 400
plan_named_whole: 3
plan_derive_n: 8
plan_claims_max: 20
plan_related_n: 4
plan_related_back: 4
plan_related_claims: true
term_map: true
term_map_files: 2
case_model: true
case_max_tokens: 2400
gap_followup: true
query_expansion: false
rerank: false
web:
  enabled: false              # off in the service: the caller's live facts must not reach a web search (customer data stays on site)
consensus_samples: 1
context_window: 128000             # the deployed model's window; the conversation is sent whole (MISSION.md, section 5)
image_tokens: 1500
primer:
  rules: true
  terms: true
provider_order: {}
# The answer service (answer_service.py): jobs, traces, attachments (R-E2-008, R-E2-014, R-E2-023)
max_running_jobs: 4                # answers running at once; more wait, up to max_queued_jobs, then HTTP 429
max_queued_jobs: 20
job_time_limit_s: 600              # a job that runs longer fails with time_limit
job_keep_s: 900                    # a finished job can be read this long
heartbeat_s: 5                     # a waiting or running job's updated_at moves at least this often
trace_dir: ~/.agent-e2/traces      # one JSON file per answer; the env variable AGENT_E2_TRACE_DIR replaces it
trace_days: 30
answer_reserve_tokens: 60000       # kept free in the context window for the knowledge files and the answer
max_body_bytes: 41943040           # 40 MB: five images and three CSV files in base64, with the text
question_bands: false           # R-E2-025: the band of a value in a question or screenshot, by code; off until M5 and an answer test
