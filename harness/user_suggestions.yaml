# Suggested questions: what Agent E2 offers the user to ask about a whole page, by the page's situation.
# Read by user_suggestions.py. Release 1.0: Cluster Performance, Cluster Capacity, ESXi Performance, VM Performance.
#
# A page has a level (good, medium, bad) and may have a movement (declining or dip for performance, rising for capacity).
# Each page also has metric questions: how its KPIs work, answered from the knowledge base, the strength of Agent E2.
# The user sees 3: with a movement, 2 movement questions and 1 metric question; good with no movement, 1 level question and
# 2 metric questions (nothing is wrong, so the metric itself is worth learning); medium or bad, 2 level and 1 metric.
# {time} is the time of the KPI's worst point, as the screen writes it.
# Each question is one Agent E2 can answer from the page's numbers and its knowledge base: facts and the mechanism, never the fix.
# Checked on the real model with PCM's page facts (2026-11-23). Not asked: what the page does not hold (peer hosts, a run-out
# date: PCM shows no forecast).
# Performance has shorter time (minutes to hours). Capacity uses longer time (days to months) when making a rightsizing decision

performance:
  cluster:
    good:
      - Does the good average hide VMs that still suffer?
      - Is a good score here a reason to add more VMs?
    medium:
      - Which metric pulls Cluster Performance down?
      - Is it a few VMs or most of them?
      - Is one host the cause of the slowness?
    bad:
      - Which VMs are hit hardest, and on which resource?
      - Is the cause CPU, memory, disk or network?
    declining:
      - Why is performance declining?      
    dip:
      - Why did performance drop at {time}?
      - Was the drop on one host or across the cluster?
    metric:
      - How does Cluster Performance (%) work, and what is its formula?
      - What does Cluster Risk (%) actually measure?
      - Why does Cluster Performance read the worst VM and the 90th percentile, not the average?
      - Why is Cluster Performance not the same as cluster utilization?
      - What size of move counts as a real drop?
  host:
    good:
      - Does any VM on this host still suffer?
      - Is high utilization on this host a problem?
      - Can a VM here still be slow while this host scores well?
    medium:
      - Which VMs on this host are near their limit?
      - Which resource is the constraint here?
      - Is it a few VMs or most of them?
    bad:
      - Which VMs suffer most, and on which resource?
      - Is the problem this host, or the whole cluster?
      - Does ballooning or swapping here hurt the VMs?
    declining:
      - Why is performance on this host declining?
      - Is the decline on this host only, or cluster-wide?
    dip:
      - Why did this host drop at {time}?
    metric:
      - How does ESXi Performance (%) work, and what is its formula?
      - Why does ESXi Performance read the VMs on the host, not the host's utilization?
      - Why is host ballooning or swapping not part of ESXi Performance?      
  vm:
    good:
      - Does the good average hide a short peak?
    medium:
      - Is the issue caused by this VM itself, or its parent ESXi host?
    bad:
      - Is the cause in the VM itself, its parent host or its datastore?      
      - Which metric slowed this VM at its worst point?
    declining:
      - Why is this VM's performance declining?
      - Did its demand grow, or did its parent ESXi host get busier?
    dip:
      - Why did this VM drop at {time}?
    metric:
      - How does VM Performance (%) work, and what is its formula?
      - Why are the Guest OS and the VM two separate charts?
      - What does Guest OS Performance (%) measure?
      - Why are some metrics left out of the score while they are green?

capacity:
  cluster:
    good:
      - How many more VMs can this cluster take?
      - Is the room left real, or held by reservations?
      - Is the overcommit ratio right for this class of service?
    medium:
      - Which resource runs out first?
      - Can rightsizing VMs win back Cluster capacity?
    bad:
      - Why is this cluster closed for new VMs?
      - Is the shortage real demand, or reservations and oversized VMs?
    rising:
      - Why is demand growing in this cluster?
    metric:
      - What does Cluster Consumption (%) measure, and how is it computed?
      - Why is capacity read against usable capacity, not total capacity?
      - How does the close-for-business check decide?
      - Why does Cluster Risk count in a capacity decision?
      - Why is high utilization good for capacity but not a performance problem?

# The showcase question of a card (an E2 mark on a KPI, a metric or a case part), first among the card's questions.
# First row whose card matches and whose condition holds wins; a row without "when" always holds. The conditions are read
# by code from the card's figures (user_suggestions.py, CARD_CONDITIONS). {before} and {after}: the bands across a step.
cards:
  - {pillar: performance, card: Cluster Performance, when: dropped, q: "Which part pulled Cluster Performance down at its worst point, and by how much?"}
  - {pillar: performance, card: Cluster Performance, q: "How does Cluster Performance (%) work, and what is its formula?"}
  - {pillar: performance, card: Cluster Risk, when: stepped_other_held, q: "Risk went from {before} to {after}, but Performance did not drop. Explain to me why."}
  - {pillar: performance, card: Cluster Risk, q: "What does Cluster Risk (%) actually measure?"}
  - {pillar: performance, card: ESXi Performance, when: not_green, q: "Is this host's score low because the host is overloaded?"}
  - {pillar: performance, card: ESXi Performance, q: "Can a VM here still be slow while this host scores well?"}
  - {pillar: performance, card: VM Performance, when: layers_diverged, q: "Why are there 2 charts? Why did VM Performance go down while Guest OS Performance did not?"}
  - {pillar: performance, card: VM Performance, q: "Why are the Guest OS and the VM two separate charts?"}
  - {pillar: performance, card: Guest OS Performance, when: layers_diverged, q: "Why are there 2 charts? Why did Guest OS Performance go down while VM Performance did not?"}
  - {pillar: performance, card: Guest OS Performance, q: "Why are the Guest OS and the VM two separate charts?"}
  - {pillar: performance, card: Peak CPU Ready among any vCPU, q: "Is CPU Ready above 5% always bad?"}
  - {pillar: performance, card: Peak run queue length per vCPU, q: "Does this VM need more vCPUs?"}
  - {pillar: performance, card: Free memory, q: "Is low free memory a sign the Guest OS is short of RAM?"}
  - {pillar: capacity, card: Cluster Consumption, when: memory_consumed_high, q: "Memory Consumed is high. Does this cluster need more RAM?"}
  - {pillar: capacity, card: Cluster Consumption, q: "What does Cluster Consumption (%) measure, and how is it computed?"}
  - {pillar: capacity, card: Cluster Performance, when: closed_performance_fine, q: "Why is this cluster closed when its performance is fine?"}
  - {pillar: capacity, card: Cluster Performance, q: "Why does the capacity check read the 5th percentile of Cluster Performance?"}
  - {pillar: capacity, card: Cluster Risk, when: closed_not_by_risk, q: "Why does Cluster Risk not decide this cluster's status?"}
  - {pillar: capacity, card: Cluster Risk, q: "When does Cluster Risk decide whether this cluster takes more VMs?"}
  - {pillar: case, card: link, q: "What evidence supports this link?"}
  - {pillar: case, card: layer, q: "Is this layer the cause, or a symptom?"}
