# Benchmark runner configuration. Runner: benchmark/runner/README.md. Models: benchmark/models.md.
gateway: https://ai-gateway.vercel.sh/v1   # API key from env AI_GATEWAY_API_KEY

models:                       # candidates; all must read screenshots (vision). List and reasons: benchmark/models.md
  - google/gemma-4-31b-it
  - alibaba/qwen3.8-27b
  - meta/muse-glimmer-30b       # added 2026-11-05: 29.8B, vision, Apache 2.0 (Hugging Face meta-models/Muse-Glimmer-30B)

# Grades free-text and compound answers 0-3 (benchmark/runner/judge.py). Never a candidate.
# Other vendor than the frontier reference (anthropic/claude-opus-5.5), so no model grades its own family.
judge_model: openai/gpt-5.6-sol
judge_temperature: 0
judge_max_tokens: 1500

modes: [baseline, classic, agentic]
runs: 5                       # repeats per question per model per mode
temperature: 0.2              # use the value the website will use; fixed for a whole run
max_tokens: 4000              # reasoning models spend tokens before the ANSWER line
concurrency: 12               # parallel requests; 12 tested OK (benchmark 20261103-081849); lower it on HTTP 429

embedding_model: alibaba/qwen3-embedding-0.6b   # null = BM25 only
classic_k: 6                  # files from the search before link expansion
context_tokens: 8000          # classic mode context budget
expand_derive: true           # classic: add up to 3 internal_derive files of the top 2 hits (retrieval check 2026-11-06: 70% -> 71%, 50 -> 52 of 90 complete)
route_diagnosis: true         # classic: a troubleshooting question puts its best diagnosis file first (71%, 51 of 90; both together with the above: 73%, 53 of 90)
query_expansion: false        # add glossary preferred words to the query; no gain measured (the glossary has 2 synonym rows), off
agent_max_calls: 8            # tool calls per question
agent_tool_tokens: 12000      # tool output budget per question
context_window: 32000         # the deployed model's window (DESIGN.md, section 5); the agent stops calling tools before the prompt outgrows it
image_tokens: 1500            # estimated prompt tokens per image, for the window check; re-check against the deployed model
agent_primer:                 # up-front blocks for the agent (harness/primer.py, harness/AGENT.md section 3); off until the benchmark shows a gain
  map: false                  # what each area holds, what each file kind answers
  rules: false                # core rules (knowledge/vsphere/foundations/core-rules.md)
  terms: false                # confusable pairs (knowledge/glossary.md)
  flows: false                # symptom -> flow index
  procedure: false            # how to use the tools

# Pin providers per model when known, e.g. openai/gpt-oss-20b: [groq]
provider_order: {}
