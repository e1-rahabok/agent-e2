# Benchmark runner configuration. Runner: benchmark/runner/README.md. Models: benchmark/models.md.
gateway: https://ai-gateway.vercel.sh/v1   # API key from env AI_GATEWAY_API_KEY

models:                       # candidates; all must read screenshots (vision). List and reasons: benchmark/models.md
  - google/gemma-4-31b-it
  - alibaba/qwen3.8-27b
  - meta/muse-glimmer-30b       # added 2026-11-05: 29.8B, vision, Apache 2.0 (Hugging Face meta-models/Muse-Glimmer-30B)

# Grades free-text and compound answers 0-3 (benchmark/runner/judge.py). Never a candidate.
# Other vendor than the frontier reference (anthropic/claude-opus-5.5), so no model grades its own family.
# Release gate limits and the reference: benchmark/runner/report.py, GATE and REFERENCE (benchmark/design.md, section 7.5).
judge_model: openai/gpt-6.1-terra   # 2026-11-13: USD 1 and 5 per million tokens, 4x cheaper than gpt-5.6-sol; agreement on 100 saved answers: exact 70%, within 1 point 91%, bias +0.03 (project/plan.md). Scores are not comparable with runs graded by gpt-5.6-sol
judge_temperature: 0
judge_max_tokens: 1500

modes: [baseline, agent-e2]     # the model alone, and Agent E2 (harness/AGENT.md). The frontier reference runs mode web (release.runs)
runs: 5                       # repeats per question per model per mode
temperature: null             # models without a `sampling` entry: null = the provider's default
sampling:                     # per model: the settings of its own card (generation_config.json on Hugging Face), which a local server
                              # such as vLLM applies by default, so the benchmark sees what a user sees (author, 2026-11-13). Checked 2026-11-13
  google/gemma-4-31b-it: {temperature: 1.0, top_p: 0.95, top_k: 64}
  meta/muse-glimmer-30b: {temperature: 1.0, top_p: 0.95, top_k: 64}
  alibaba/qwen3.8-27b: {temperature: 1.0, top_p: 0.95, top_k: 20}
  anthropic/claude-opus-5.5: {}   # frontier reference: nothing sent, the provider's default, as a chat user meets it
max_tokens: 4000              # per answer, thinking included: a reasoning model that thinks past it is cut off before the ANSWER line (the health check stops such a run)
concurrency: 12               # proven parallel requests per model. The floor: the runner never goes below it
concurrency_by_model:         # the proven value of a model that rate-limits earlier than 12
  anthropic/claude-opus-5.5: 3   # HTTP 429 at 12, 0 errors at 3
model_params:                 # per model, a list of request settings in order of preference. The preflight (preflight.py) tries them on a sample and
                              # keeps the first that answers cleanly: no cut-off answers, every letter readable. run.py without --params uses the first.
                              # Fields: reasoning (sent to the gateway as is), max_tokens (replaces max_tokens above). The gateway lists what a model accepts
                              # in /v1/models, field reasoning_options (benchmark/models.md, section 5).
  alibaba/qwen3.8-27b:        # reasoning model: 3,700-4,300 tokens per answer with the default, 85% of baseline answers cut at the 4,000 cap
    - {reasoning: {effort: none}}
    - {reasoning: {effort: low}}
    - {reasoning: {effort: low}, max_tokens: 8000}
  meta/muse-glimmer-30b:      # reasoning model: 2,000-3,000 tokens per answer with the default
    - {reasoning: {enabled: false}}
    - {reasoning: {effort: low}}
    - {reasoning: {effort: low}, max_tokens: 8000}
  google/gemma-4-31b-it:      # 160-380 tokens per answer with the default
    - {}
  anthropic/claude-opus-5.5:  # frontier reference: effort capped at medium (Q164, benchmark/models.md section 5)
    - {reasoning: {effort: medium}, max_tokens: 8000}
    - {max_tokens: 8000}
max_minutes: null              # stop cleanly after this many minutes (exit code 3, then --resume). A Claude Code cloud background command stops after 120: use --max-minutes 110 there
adaptive_concurrency:         # probe above the proven value, one model at a time (benchmark/runner/governor.py)
  enabled: true
  step: 2                     # levels: proven, proven + 2, proven + 4 (12, 14, 16)
  max_probes: 2
  window: 40                  # answers measured at each level, one mode only
  gain_fraction: 0.5          # a step must deliver this share of the ideal gain in answers per minute; HTTP 429 returns to proven

embedding_model: alibaba/qwen3-embedding-0.6b   # null = BM25 only
search_k: 6                   # hybrid search hits of the question: the top 3 read whole (tier 3), 4-6 as sections (harness/planner.py)
context_tokens: 16000         # the reading set's budget (harness/AGENT.md, section 4.2)
plan_section_tokens: 400      # reading plan: files below the whole-file tiers give their best sections, at most this many tokens each
plan_derive_n: 8              # reading plan: internal_derive files taken per named file (the mechanism closure)
plan_claims_max: 10           # reading plan: one search per claim, at most this many claims
term_map: true                # user words -> knowledge-base terms, files and notes (knowledge/catalog/user-terms.yaml, harness/terms.py)
term_map_files: 2             # files pulled in from the matched rows (tier 2)
case_model: true              # stage 1: the model reads the question into a case (temperature 0); false = the code-only reading
case_max_tokens: 1200
gap_followup: true            # stage 6: one more answer turn when the draft names a metric whose file was not read
query_expansion: false        # add glossary preferred words to the query; no gain measured (the glossary has 2 synonym rows), off
rerank: false                 # cross-encoder bge-reranker-v2-m3 over the top fused chunks (harness/rerank.py); retrieval check 2026-11-06, BM25: 56 of 90 without; best variant 56 (fuse, top 10), others 44-52. No gain, off
rerank_model: bge-reranker-v2-m3
rerank_n: 10
rerank_mode: fuse              # fuse: its rank added to the fusion; replace: its order alone
rerank_stem: false             # true: score the question without its options
web:                          # public web knowledge (harness/web.py; MISSION.md, section 5)
  enabled: true               # read URLs in the question before Agent E2 answers
  fetch: true
  search_backend: gateway     # gateway: Vercel AI Gateway's Perplexity search (benchmark; needs AI_GATEWAY_API_KEY, about USD 0.006 a search, 2026-11-09). searxng: a customer's SearXNG at search_url
  search_url: null            # SearXNG-style JSON endpoint, e.g. https://searx.example/search
  gateway_search_model: google/gemma-4-31b-it   # lists the result URLs; the harness fetches the pages itself
  search_timeout: 60          # a gateway search takes 10-20 seconds
  allow_hosts: []             # pages the user links: empty = any public host; a customer can restrict
  search_hosts: [techdocs.broadcom.com, knowledge.broadcom.com, docs.vmware.com, developer.broadcom.com]  # search returns only vendor documentation
  timeout: 15
  max_bytes: 3000000
  page_tokens: 2000           # a page is trimmed to the parts most relevant to the question
  search_results: 5
  search_fetch: 2             # result pages read for a current-facts question
consensus_samples: 1          # multiple choice, Agent E2: n answer samples on one reading set; unanimous letters stand, else Unsure (harness/README.md, section Consensus).
                              # The benchmark keeps 1: report.py projects consensus of 3 exactly from the 5 runs, at a third of the cost. The deployed
                              # profile sets 3 (round of 2026-11-13, projected: confident-wrong multiple choice 10-18% -> 2-6%)
context_window: 32000         # the deployed model's window (MISSION.md, section 5); a prompt above it is flagged in the trace (context_over)
image_tokens: 1500            # estimated prompt tokens per image, for the window check; re-check against the deployed model
primer:                       # up-front blocks in Agent E2's answer prompt (harness/primer.py)
  rules: true                 # Level 300 misconceptions: the ## Misconceptions lines marked up_front in their files
  terms: true                 # confusable pairs (knowledge/glossary.md)

# Pin providers per model when known, e.g. openai/gpt-oss-20b: [groq]
provider_order: {}

release:                      # the final round: benchmark/RUN.md. One run folder per entry, all started together (run_all.py)
  runs:
    - {model: google/gemma-4-31b-it, modes: [baseline, agent-e2]}
    - {model: alibaba/qwen3.8-27b, modes: [baseline, agent-e2]}
    - {model: meta/muse-glimmer-30b, modes: [baseline, agent-e2]}
    - {model: anthropic/claude-opus-5.5, modes: [web]}    # frontier reference as a user meets it: search available, the model decides; no prompt-only mode (author, 2026-11-13)
  reference: anthropic/claude-opus-5.5
  max_cost_usd: 150           # preflight refuses the round when the projected cost (with the safety factor) is above this
  cost_safety: 1.3            # the sample is small: projected cost x this factor must fit the credits and max_cost_usd
  max_hours: 6                # preflight refuses the round when the slowest run is projected above this
  preflight:
    questions: 7              # per model and mode: 4 multiple-choice, 2 judged, 1 screenshot question (the vision path); 6 multiple-choice when no question is judged
    min_parse_rate: 0.95      # share of multiple-choice sample answers with a readable letter
    max_token_share: 0.5      # mean completion tokens of the sample must stay below this share of max_tokens
  retries: 2                  # relaunches of a run that crashed (exit 1), each with --resume
