title: 'VCF Operations shows CPU Demand far above Usage. Do we need another host?'
short_title: CPU Demand Demo
page: cpu-demand.html
user: L2 vSphere specialist
context: 'Quick answer · host esx-07'
about: |
  - One question an L2 specialist asks, and the recorded answer of the Agent E2 pipeline (a local model reading the knowledge base), unedited. The host and its readings are a scenario.
  - The specialist types the readings into the question; no connector is needed.
  - Gate before this page was built: the same question was run 3 times; every run had to carry the answer points written before the run and none of the claims the question carries. All 3 runs passed; run 1 is shown, flaws included.
object: {kind: ESXi host, name: esx-07, meta: '9 VMs · a quiet week'}
tiles:
- {label: 'ESXi CPU Usage', unit: '%', value: 15, band: green, note: 'both tools, all week'}
- {label: 'ESXi CPU Demand, VCF Operations', unit: '%', value: 38, band: grey, note: 'flat all week'}
- {label: 'ESXi CPU Demand, vCenter', unit: '%', value: 11, band: grey, note: 'below Usage'}
claims:
- 'Manager: the VCF Operations gap is unmet demand, so the cluster needs another host.'
- 'The two tools disagree, so one of them must be wrong.'
knowledge:
- {id: vsphere/technology/cpu/metrics/host/demand, what: 'Same name, two formulas: VCF Operations adds the kernel''s CPU reservation and, per VM, the higher of demand and reservation.'}
- {id: vsphere/technology/cpu/metrics/host/usage, what: 'Usage is one counter in both tools.'}
twin: {title: 'ESXi CPU Demand and Usage: vCenter vs VCF Operations', url: 'https://github.com/e1-rahabok/agent-e2/blob/main/benchmark/questions/L3-057-esxi-cpu-demand-vcenter-vs-vcf-operations.md', models: [Muse Glimmer 30B, Gemma 31B, Qwen 27B], e2: [5, 5, 5], alone: [0, 0, 0]}
key:
  must_say:
  - 'No: the gap is not unmet demand, and it does not call for another host.'
  - 'Same name, two formulas: vCenter counts the demand of the running VMs only; VCF Operations adds the kernel CPU reservation and, per VM, takes the higher of its demand and its CPU reservation.'
  - 'On a quiet host the gap is reserved capacity.'
  - 'Contention is read from Ready and Co-stop (CPU Contention), not from Demand minus Usage.'
  must_not:
  - 'Add a host.'
  - 'One tool is wrong, or the gap is a rollup bug.'
  - 'VCF Operations adds each VM''s reservation to its demand (a sum, not the higher of the two).'
run: {model: meta/muse-glimmer-30b, label: 'Muse Glimmer 30B', params: 'reasoning effort low', shown: run1}
