# Allowed tag values and avoided phrases. Read by tools/lint.py.
# Change values here, not in the script. Term meanings: knowledge/glossary.md.
retriever_guide: [how-it-works, metric-meaning, term-meaning, what-to-set, health-check, troubleshooting, decision-tree]
scope: [sp5-framework, vsphere, vcf-operations, guest-os]
technology: [cpu, gpu, memory, storage, network, system]
pillar: [availability, performance, compliance, capacity, value]
product: [vsphere, vsan, nsx, vcf-operations, windows, linux, kubernetes]
object: [VirtualMachine, HostSystem, ClusterComputeResource, ResourcePool, Datastore, StoragePod, Datacenter, Folder, VmwareDistributedVirtualSwitch, DistributedVirtualPortgroup, vSphereWorld, VCenterServer]
instance: [aggregate, per-vcpu, per-vmnic, per-vmhba, per-virtual-disk]
layer: [guest-os, virtual-motherboard, hypervisor, physical]
metric_class: [contention, consumption, context]
status: [draft, reviewed]
ui: [vsphere-client, esxtop, vcf-operations]   # screen library files (knowledge/*/screens/)
image_type: [diagram, table, timeline, distribution, scatter, screenshot]
# Phrases rejected in body text of files whose technology includes cpu (scheduling language rule).
avoid_in_cpu_files: ['\bneeds?\b', '\bneeded\b', '\bwants?\b', '\bwish(es)?\b', 'uses only .* of what it needs']
# Metric names from the book that contain an avoided word. Case-sensitive. Removed before the check above.
allow_in_cpu_files: ['Guest OS (CPU )?Needed( Memory)?', 'VM (CPU|Memory) Needed', 'Needed Memory']
# Benchmark questions (benchmark/README.md, section Metadata tags).
question_status: [draft, awaiting-input, reviewed, retired, deferred]
# The 12 misconception types of KNOWLEDGE-ENGINEERING.md, section Misconceptions and Level 400. A question lists the ones it tests.
misconception_type: [same-name-other-object, layer-confusion, consumption-as-contention, average-hides-worst, rollup-and-interval, unit-and-normalization, frequency-and-hyper-threading, provider-vs-consumer, cumulative-vs-current, threshold-transplanted, reclamation-as-contention, tool-confusion]
# Question tags for the coverage count (benchmark/design.md, section 3.7). A list each.
question_object: [vm, esxi, cluster, resource-pool, datastore, network, guest-os]
question_tool: [vcenter, vcf-operations, esxtop, guest-os-tools, none]
# Fairness (benchmark/design.md, section 6.1): Agent E2 terms and vCommunity management pack metrics that a frontier model cannot know.
# Rejected in the title, prompt, likely wrong answer and expected key points of every question that runs (not retired, deferred or awaiting input).
question_fairness:
  '(?i)\bSP5\b': 'Agent E2 framework name'
  '(?i)triple[- ]see': 'Agent E2 method name'
  '\bKPIs?\b': 'Agent E2 score; name the counter'
  '(?i)vcommunity': 'management pack, not public'
  '(?i)virtual motherboard': 'VM'
  '\bCluster (Performance|Consumption|Risk)\b': 'vCommunity model; use native counters'
  '(?i)close for business': 'vCommunity model'
  '(?i)\b(VM|Guest OS|ESXi) Performance \(%\)': 'vCommunity score'
  '(?i)inter-host imbalance': 'vCommunity metric'
  '(?i)IaaS high utili[sz]ation': 'Agent E2 grouping'
  '(?i)\brealms?\b': 'Agent E2 term; say layer'
# Size cap of a CSV attachment in 1.0: the runner puts it in the prompt (benchmark/design.md, section 13.1). About 3,000 tokens.
question_csv_max_chars: 12000
# Prompt-injection guard: rejected in every knowledge file (body and metadata) and every benchmark prompt.
injection_patterns: ['<!--', '[\u200b-\u200f\u2060\ufeff]', '(?i)ignore (all |any )?(previous|prior|above) instructions', '(?i)disregard (the )?(above|previous|prior)', '(?i)you are now (a|an|the)\b', '(?i)new instructions:', '(?i)system prompt']
# Phrases rejected in body text of every knowledge file.
avoid_everywhere: ['\[author-correction', '\[claude-knowledge\]']
# AI-speak: filler words and stock phrases of generated text. Plain words instead (project/knowledge-rules/writing.md).
# Checked where the repository terms are checked. Domain words stay allowed: utilization/utilized, realm (the author's word).
avoid_ai_speak:
  '(?i)\bdelv(e|es|ed|ing)\b': 'look at, read'
  '(?i)\bleverag(e|es|ed|ing)\b': 'use'
  '(?i)\bseamless(ly)?\b': 'drop it'
  '(?i)\brobust(ly|ness)?\b': 'name the property: tested, stable, exact'
  '(?i)\bfacilitat(e|es|ed|ing)\b': 'help, allow'
  '(?i)\bempower(s|ed|ing)?\b': 'let, allow'
  '(?i)\bunlock(s|ed|ing)?\b': 'allow, give'
  '(?i)\bstreamlin(e|es|ed|ing)\b': 'simplify, shorten'
  '(?i)\b(cutting-edge|state-of-the-art|game[- ]chang(er|ing))\b': 'say what it does'
  '(?i)\b(paradigm|synerg(y|ies|istic)|tapestry|landscape)\b': 'name the thing'
  '(?i)\bembark(s|ed|ing)?\b': 'start'
  '(?i)\bnavigat(e|ing) the\b': 'drop it'
  '(?i)\bplays? an? (crucial|key|vital|pivotal) role\b': 'say what it does'
  '(?i)\b(crucial|pivotal|paramount)\b': 'drop it, or give the reason'
  '(?i)\bit(''s| is) (important|worth) (to note|noting)\b': 'drop it; state the fact'
  '(?i)\b(furthermore|moreover|additionally)\b': 'drop it; one fact per bullet'
  '(?i)\bin (conclusion|today''s)\b': 'drop it'
  '(^|[.:-]\s*)(?i:in summary)[,:]': 'drop it'
  '(?i)\bin order to\b': 'to'
  '(?i)\bensure that\b': 'check that, so that'
  '(?i)\b(meticulous(ly)?|nuanced)\b': 'drop it'
  '(?i)\bfoster(s|ed|ing)?\b': 'build, keep'
  '(?i)\bharness(es|ed|ing)? the power\b': 'use'
  '(?i)\bat its core\b': 'drop it'
  '(?i)\bdive (deep )?into\b': 'read, explain'
  '(?i)\bkey takeaways?\b': 'drop it'
  '(?i)\b(rest assured|I hope this helps|great question)\b': 'drop it'
# Repository terms: one word per concept (project/terms.md). Checked in every markdown file except
# project/terms.md, project/author-questions.md (the author's own words), project/archive/ and benchmark/results/.
avoid_repo_terms:
  '(?i)\bgolden (cases?|set|questions?)': 'question, or question set'
  '\bAuto Test\b': 'benchmark'
  '(?i)\b(test|benchmark) cases?\b': 'question'
  '(?i)\bexam questions?\b': 'question'
  'benchmark/cases\b': 'benchmark/questions'
  '(?i)\b(retrieval|harness-only) test\b': 'retrieval check'
  '(?i)\b(model|AI) under test\b': 'candidate'
  '\bTest design\b': 'Benchmark design'
  'test-design\.md': 'benchmark/design.md'
