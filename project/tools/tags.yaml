# Allowed tag values and avoided phrases. Read by tools/lint.py.
# Change values here, not in the script. Term meanings: knowledge/glossary.md.
retriever_guide: [how-it-works, metric-meaning, term-meaning, what-to-set, what-to-check]
scope: [vendor-neutral, operations-management, vsphere, vcf-operations, guest-os]
technology: [cpu, gpu, memory, storage, network, system]
pillar: [availability, performance, security, capacity, value]
product: [vsphere, vsan, nsx, vcf-operations, windows, linux, kubernetes]
object: [VirtualMachine, HostSystem, ClusterComputeResource, ResourcePool, Datastore, StoragePod, Datacenter, Folder, VmwareDistributedVirtualSwitch, DistributedVirtualPortgroup, vSphereWorld, VCenterServer]
instance: [aggregate, per-vcpu, per-vmnic, per-vmhba, per-virtual-disk]
layer: [guest-os, virtual-motherboard, hypervisor, physical]
metric_class: [contention, consumption, context]
status: [draft, reviewed]
ui: [vsphere-client, esxtop, vcf-operations]   # screen library files (knowledge/*/screens/)
image_type: [diagram, table, timeline, distribution, scatter, screenshot]
# Phrases rejected in body text of files whose technology includes cpu (scheduling language rule).
avoid_in_cpu_files: ['\bneeds?\b', '\bneeded\b', '\bwants?\b', '\bwish(es)?\b', 'uses only .* of what it needs']
# Metric names from the book that contain an avoided word. Case-sensitive. Removed before the check above.
allow_in_cpu_files: ['Guest OS (CPU )?Needed( Memory)?', 'VM (CPU|Memory) Needed', 'Needed Memory']
# Prompt-injection guard: rejected in every knowledge file (body and metadata) and every benchmark prompt.
injection_patterns: ['<!--', '[\u200b-\u200f\u2060\ufeff]', '(?i)ignore (all |any )?(previous|prior|above) instructions', '(?i)disregard (the )?(above|previous|prior)', '(?i)you are now (a|an|the)\b', '(?i)new instructions:', '(?i)system prompt']
# Phrases rejected in body text of every knowledge file.
avoid_everywhere: ['\[author-correction', '\[claude-knowledge\]']
# Repository terms: one word per concept (project/terms.md). Checked in every markdown file except
# project/terms.md, project/author-questions.md (the author's own words), project/archive/ and benchmark/results/.
avoid_repo_terms:
  '(?i)\bgolden (cases?|set|questions?)': 'question, or question set'
  '\bAuto Test\b': 'benchmark'
  '(?i)\b(test|benchmark) cases?\b': 'question'
  '(?i)\bexam questions?\b': 'question'
  'benchmark/cases\b': 'benchmark/questions'
  '(?i)\b(retrieval|harness-only) test\b': 'retrieval check'
  '(?i)\b(model|AI) under test\b': 'candidate'
  '\bTest design\b': 'Benchmark design'
  'test-design\.md': 'benchmark/design.md'
