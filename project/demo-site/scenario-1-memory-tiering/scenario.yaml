title: 'Nobody did anything wrong'
short_title: Memory Tiering Demo
subtitle: 'Scenario 1. A bank payments cluster on VCF 9.1.1 with memory tiering. Two correct changes by two teams, then a long weekend. Risk (potential) warned on Wednesday and Friday; contention (actual) hit on Tuesday. The L2 specialist on call knows neither change. Agent E2 answers from its knowledge base only; every answer below is unedited output of the Agent E2 pipeline.'
summary:
- title: The trap
  text: |
    - L1: "1.6 TB consumed on 1 TB hosts, we are swapping."
    - Capacity: "Memory Capacity Remaining was 38%."
    - DBA: "Our SQL VMs show no wait."
    - VM Performance (%) 99 and Cluster Performance (%) 96: green.
    Every one of them is right about its own number, and every one points away from the cause.
- title: The cause
  text: |
    - CHG-1 turned memory tiering off on 6 SQL VMs and reserved all their memory: each takes 256 GB of DRAM away from the tiered VMs on its host.
    - CHG-2 added 40 VMs, approved on a capacity number that counts NVMe as DRAM.
    - The long weekend let idle pages go cold. On Tuesday the working set no longer fits the DRAM left: the VMs wait on NVMe.
- title: What Agent E2 must show
  text: |
    - Contention against consumption against context, read together (Triple See).
    - The NVMe wait that memory contention does not count.
    - A sustained read, not a warm-up, against the August baseline.
    - The Cluster Risk rows that stepped up on Tuesday night and Thursday night: the clue to two changes the specialist never saw.
week:
- {when: 'Mon', what: 'Normal. Memory tiering on since June; active memory 45% of DRAM.', seen: ''}
- {when: 'Tue 22:00-23:30', what: '**CHG-1**, DBA team, blueprint SQL Gold v3: sql-pay-01 to 06 (16 vCPU, 256 GB) powered off, `sched.mem.enableTiering = FALSE`, all memory reserved, powered on. Broadcom guidance for SQL.', seen: 'Seen by the DBA team only.'}
- {when: 'Wed', what: 'Fine for users. Cluster Risk: memory reservation steps from 0 to 26%.', seen: 'Nobody looks.'}
- {when: 'Thu 21:00-23:40', what: '**CHG-2**, application team: 40 VMs (8 vCPU, 32 GB) moved in, approved on Memory Capacity Remaining 38%.', seen: 'Seen by the application and capacity teams.'}
- {when: 'Fri', what: 'Fine for users. Cluster Risk: active memory leaves green (52.7%), NVMe latency turns yellow. Cluster Performance 98.', seen: 'Nobody looks.'}
- {when: 'Sat-Mon', what: 'National Day long weekend. Idle pages go cold and move to NVMe.', seen: ''}
- {when: 'Tue 09:05', what: 'Payments API p99 latency from 180 ms to 1.4 s.', seen: 'Service desk.'}
- {when: 'Tue 10:20', what: 'The L2 vSphere specialist is called. Not part of either change; the change calendar is not open to them yet.', seen: ''}
