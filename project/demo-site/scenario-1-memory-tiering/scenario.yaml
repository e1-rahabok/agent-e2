checks:
- {id: t1-nvme-wait, turn: 1, text: 'Explains VM Performance 17 with Memory Contention at 0.2%: Memory Contention does not count NVMe fetches; NVMe wait of pay-api-07 is about 5.6% of its vCPU time.', kb: [vsphere/object-types/vm/vm-performance, vsphere/object-types/cluster/cluster-performance]}
- {id: t1-why-now, turn: 1, text: 'Explains why now: DRAM consumed passed 80% on Friday, so tiering started for the first time; over the weekend idle pages moved to NVMe; on Tuesday they come back.', kb: [vsphere/technology/memory/concepts/memory-tiering, vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host]}
- {id: t1-active, turn: 1, text: 'Active memory 77% of DRAM: above 75%, significant loss expected.', kb: [vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host]}
- {id: t1-sustained, turn: 1, text: 'Sustained, not a warm-up: 380 then 360 MBps an hour apart.', kb: [vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host]}
- {id: t1-capacity, turn: 1, text: 'Rejects Capacity Remaining as proof: it counts NVMe as DRAM; active memory against DRAM is the limit.', kb: [vcf-operations/features/capacity-forecast]}
- {id: t1-risk, turn: 1, text: 'Reads the Cluster Risk rise as two changes (memory reservation at Tue 23:25; overcommit at Thu 23:35) and asks what was changed then.', kb: [vsphere/object-types/cluster/models/cluster-risk]}
- {id: t1-action, turn: 1, text: 'Acts now: moves the heaviest NVMe readers to esxi-pay-07 or esxi-pay-08.', kb: [vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host]}
- {id: t1-ask, turn: 1, text: 'If it asks back (allowed: it should not jump), it asks for the fact that changes the answer: what was changed at Tue 23:25 and Thu 23:35. Not applicable when it answers.', kb: [vsphere/object-types/cluster/models/cluster-risk]}
- {id: t2-cause, turn: 2, text: 'Cause: CHG-1 and CHG-2 together, exposed by the long weekend; neither alone.', kb: [vsphere/technology/memory/concepts/memory-tiering, vsphere/object-types/cluster/models/cluster-risk]}
- {id: t2-rollback, turn: 2, text: 'Rolling back CHG-2 is not the first fix: a lever, not the cause.', kb: [vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host]}
- {id: t2-reservation, turn: 2, text: 'Does not lower the reservation of a VM with tiering off; gives DRAM back by turning tiering on for a SQL VM that is not latency-sensitive (a power cycle).', kb: [vsphere/technology/memory/concepts/memory-tiering]}
- {id: t2-process, turn: 2, text: 'Process: approve capacity on active memory against DRAM, not on Capacity Remaining.', kb: [vsphere/technology/memory/concepts/memory-tiering, vcf-operations/features/capacity-forecast]}
