scoring_note: 'Scored by reading each answer against the check: the scores are judgment, the answers are verbatim. Asking back is allowed (Agent E2 should not jump): Qwen asked two questions in turn 1, so its turn 1 checks are read on the answer it gave after the specialist replied. One run per model, so the numbers move between runs.'
lessons: |
    - **The knowledge base and the harness carry the scenario.** The frontier model, run through the same Agent E2 pipeline and the same knowledge base, passes 9.5 of 11 checks and cites a file for each claim. Every fact it needs is in the knowledge base.
    - **The local candidates do not, yet.** Gemma 31B passes 4 of 11 and Qwen 27B 5 of 12. Where they fail is the same: comparing two readings in time (sustained against warm-up), reading the risk history to date the changes, and acting (moving the heaviest NVMe readers). Qwen asked back first, which is allowed, but asked about the placement of sql-pay-03 rather than what was changed in the two windows the risk rows point to; its stage 1 was also cut at 2,400 tokens in both turns, so it answered without its case.
    - **Fixed while building this demo** (knowledge commit 734ed63): stage 1 failed on this long input, because the case was cut at 1,200 tokens (now 2,400); the misconception "lower the reservation of a VM with tiering off" now reaches the model up front, and both local models stopped advising it; Cluster Risk has a section on its use in troubleshooting; the decision tree tells a warm-up from a sustained read; turning tiering off per VM needs a power cycle (Broadcom KB 426485, 448305).
    - **Tried and not kept:** reading a decision tree whole when the chosen flow links to it. The retrieval check dropped from 254 to 252 complete questions, so the change was removed.
    - **Next, in the harness (stage 3, exact tools):** compute what the local models miss, before the model reads: the two readings against the past baseline (sustained or warm-up), the step changes in the Cluster Risk rows with their times, NVMe wait per VM, and active memory against the DRAM left for tiered VMs. The model then explains numbers it no longer has to derive.
    - **Not settled by the knowledge base** (named by the frontier run): whether an NVMe wait of about 5.6% alone explains a p99 of 1.4 s (Guest OS and application counters), and why DRS did not rebalance.
rerun: |
    1. `python3 project/tools/demo_scenario_executor.py project/demo-site/scenario-1-memory-tiering <model>` (needs AI_GATEWAY_API_KEY): writes `results/<model>.json`.
    2. Read the answers and set `scores` in `scenario.yaml`.
    3. `python3 project/tools/demo_page_builder.py project/demo-site/scenario-1-memory-tiering`: writes `index.html`.
