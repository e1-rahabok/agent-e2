title: 'Three changes, one slow morning'
short_title: Memory Tiering Demo
about: |
  - A replay of one root cause analysis, step by step. The cluster, its readings and the problem are a scenario; every Agent E2 answer is the recorded output of the Agent E2 pipeline (a local model reading the knowledge base), unedited.
  - Agent E2 runs on site, connected to VCF Operations and vCenter. The L2 specialist asks one narrow question per step; Agent E2 reads the data it needs, finds the facts and explains them. The specialist connects the steps, writes the root cause and proposes the fix.
  - The VCF Operations connector is not built yet: in this recording the readings stand for what it would fetch, and the pipeline gets them as text. The vCommunity management pack is the enhanced one: VM Performance and Cluster Performance score NVMe wait.
  - A boxed number comes from Agent E2's code (stage 3), not from the model.
  - One run per question, recorded on 2026-11-19, kept as it came, flaws included.
incident: {id: PRB-20931, priority: RCA, title: 'Payments API slow on Tuesday morning (INC-48213, resolved)', summary: 'The problem has disappeared. Business asks why it happened and how to avoid it.', escalated: 'assigned to L2 vSphere for RCA', now: 'L1 does not perform RCA', user: 'L2 vSphere specialist'}
l1_note: |
  INC-48213 opened at 09:12 by the service desk; escalated to L2 vSphere at 10:05. The problem has disappeared. L1 does not perform RCA, so this problem record goes to L2 vSphere.
  ## Impact
  - Payments API p99 latency 180 ms → 1.4 s from 09:05. No errors: transactions complete, slowly. Back to normal by 09:55.
  - Teller app slow at all branches.
  - First business day after the 3-day National Day weekend (Saturday to Monday). Tuesday-morning volume as usual.
  ## Scope (app team, service map)
  - The payments application runs in 2 physical data centers, 72 VMs in each. In each DC its 72 VMs sit in a single cluster.
  - In DC-01 that cluster is CL-SG-DC-PRD-01: 24 hosts, 1,006 VMs. DC-02 plays the passive standby this week.
  - VCF Operations: VM Performance alert, red, on 51 of the 72 payments VMs in DC-01, started 09:05 to 09:15, cleared by 09:55. No alert on the payments database VMs.
  - Worst hit: pay-api-01, at 17. VM Performance (%) dropped, with the NVMe metric causing it.
  ## Checked (L1 SOP): all normal
  - Hosts: all 24 connected; no HA event; no host alert.
  - VMs: CPU Ready and Memory Contention near 0; no ballooning, compression or swapping. Guest OS CPU 30-60%.
  - Datastore latency normal. Network: no drops.
  - Changes in the last 24 hours: none. Nothing changed in vSphere; no vMotion.
  ## Reason for escalation to L2
  - The problem has disappeared, but the business owner wants to know why, and how to avoid it in future.
