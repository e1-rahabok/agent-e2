scoring_note: 'Scored by reading each answer against the check: the scores are judgment, the answers are verbatim. Asking back is allowed (Agent E2 should not jump); when a model asks first, its turn 1 checks are read on the answer it gives after the specialist replies. One run per model, so the numbers move between runs.'
lessons: |
    - **The knowledge base and the harness carry the scenario.** The frontier model, run through the same Agent E2 pipeline and the same knowledge base, passes 9.5 of 11 checks and cites a file for each claim.
    - **Every model explains the red VM Performance.** With NVMe wait scored in the knowledge base (VM Performance and Cluster Performance), all three trace the 17 to an NVMe wait of about 5.6% that Memory Contention does not count.
    - **The local candidates miss the same things.** Gemma 31B and Qwen 27B pass 5 of 11 each. Neither reads the Cluster Risk rise as two dated changes, neither rejects Capacity Remaining as proof, and both blame CHG-1 alone. Gemma calls the sustained reads a warm-up although it has both readings; Qwen does not explain why the problem started now.
    - **A harness quirk:** Qwen's first answer opens with "The provided ESXi Memory Latency text does not change the diagnosis". That is the gap follow-up (a second pass with an added file) showing through; the follow-up prompt should keep the model from talking about it.
    - **Stage 1 held** on this input for every model (1,300 to 5,200 tokens at the 2,400 cap for the local models).
    - **Next, in the harness (stage 3, exact tools):** compute what the local models miss, before the model reads: the step changes in the Cluster Risk rows with their times, the two NVMe readings an hour apart (sustained or warm-up), and active memory against the DRAM left for tiered VMs. Then rerun five times per model.
    - **Not settled by the knowledge base** (named by the frontier run): whether an NVMe wait of about 5.6% alone explains a p99 of 1.4 s (Guest OS and application counters), and why DRS did not rebalance.
rerun: |
    1. `python3 project/tools/demo_scenario_executor.py project/demo-site/scenario-1-memory-tiering <model>` (needs AI_GATEWAY_API_KEY): writes `results/<model>.json`.
    2. Read the answers and set `scores` in `scenario.yaml`.
    3. `python3 project/tools/demo_page_builder.py project/demo-site/scenario-1-memory-tiering`: writes `index.html`.
