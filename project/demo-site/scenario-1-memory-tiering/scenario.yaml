title: 'Nobody did anything wrong'
short_title: Memory Tiering Demo
subtitle: 'Scenario 1. The payments application servers wait for memory pages stored on NVMe, because the hosts that also run a SQL VM no longer have enough DRAM for the application''s working set. Two changes on the same payments service, by two teams, made that happen, and a long weekend exposed it. The L2 specialist on call knows neither change. Every answer below is unedited output of the Agent E2 pipeline, answering from its knowledge base.'
summary:
- title: The service
  text: |
    - The payments service has a database tier, sql-pay-01 to 06, already in cluster CL-SG-PRD-PAY.
    - Its application tier, 40 VMs (pay-api and pay-web), ran on an old cluster until this week.
    - The cluster has 8 identical hosts, each with 1 TB of DRAM and a 1 TB NVMe memory tier. Memory tiering has been configured since June, but DRAM consumed never passed 80%, so no page had ever moved to NVMe.
- title: The cause
  text: |
    - CHG-1 (DBA team) turned memory tiering off on the 6 SQL VMs and reserved all their memory: 256 GB of each host's DRAM now belongs to one SQL VM.
    - CHG-2 (application team) moved the 40 application VMs in, approved on a capacity number that counts NVMe as DRAM. On Friday DRAM consumed passed 80%, and tiering started for the first time.
    - Over the long weekend idle application pages moved to NVMe. On Tuesday the application needs them back, and its working set no longer fits the DRAM left.
- title: What Agent E2 must show
  text: |
    - Contention, consumption and context, read together (Triple See).
    - The NVMe wait that Memory Contention does not count, behind a VM Performance of 17.
    - Why now: tiering started on Friday, and the weekend moved the pages.
    - The Cluster Risk rise on Wednesday and Friday: the clue to two changes the specialist never saw.
week:
- {when: 'Mon', what: 'Normal. DRAM consumed 68% on the worst host. NVMe consumed 0. Cluster Risk 22.5 (green).', seen: ''}
- {when: 'Tue 22:00-23:30', what: '**CHG-1**, DBA team, blueprint SQL Gold v3: sql-pay-01 to 06 (16 vCPU, 256 GB) powered off, `sched.mem.enableTiering = FALSE`, all memory reserved, powered on.', seen: 'Seen by the DBA team only.'}
- {when: 'Wed', what: 'Fine for users. The memory reservation sub-metric of Cluster Risk goes from 0 to 26%; Cluster Risk 25.5 (yellow).', seen: 'Level 1 does not act on yellow.'}
- {when: 'Thu 21:00-23:40', what: '**CHG-2**, application team: the 40 payments application VMs (8 vCPU, 32 GB) move in to sit next to their databases, approved on Memory Capacity Remaining 38%. Five land on esxi-pay-05, next to sql-pay-03.', seen: 'Seen by the application and capacity teams.'}
- {when: 'Fri', what: 'The application goes live and consumes memory. On esxi-pay-05, DRAM consumed passes 80% at 08:40, so tiering starts for the first time: new pages go to NVMe. Cluster Risk 31.1 (yellow). Cluster Performance 98; users fine.', seen: 'Level 1 does not act on yellow.'}
- {when: 'Fri 18:00 to Mon', what: 'National Day long weekend; load near zero. DRAM is above 80%, so idle pages move to NVMe: NVMe writes up, NVMe consumed 50 → 280 GB. NVMe reads stay near 0, because nobody touches those pages.', seen: ''}
- {when: 'Tue 09:05', what: 'Business resumes. The application touches its pages and they come back from NVMe. Payments API p99 latency from 180 ms to 1.4 s.', seen: 'Service desk.'}
- {when: 'Tue 10:20', what: 'The L2 vSphere specialist is called: not part of either change, and the change calendar is not open to them yet.', seen: ''}
