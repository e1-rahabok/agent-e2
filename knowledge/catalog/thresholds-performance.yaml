meta:
  id: catalog/thresholds-performance
  title: 'Performance thresholds: KPI, score change and flow tests'
  sections:
    kpi: 'The sub-metrics of the performance KPIs, five limits each (meta, limits_fields), the one place: no knowledge file repeats them. Internal target, proactive, no class of service.'
    change: 'Score change: the smallest move of a 0-100% score on a trend chart, in points of the score, that counts as a drop or a rise: a performance KPI, or a capacity model score read the same way (Cluster Risk, Cluster Consumption). A smaller move across the window is the score''s normal movement: the trend is steady. Compared with the median of the window, never with one point. Provider scores (cluster, host) move less than one VM''s, which has no breadth row to steady it, so a VM score has a larger level (8 points against 5). Without a row, Agent E2 gives the range and says no change level is set.'
    flow: 'Flow tests: a number that one step of a troubleshooting flow, health check or decision tree compares a reading with to pick the next step. Not a KPI level and not an alert. kb is the flow file, step its numbered step.'
  fields:
    id: Stable key, unique across the threshold files.
    metric: 'The metric name as the knowledge file names it: the text a user reads. No comma, and no unit or description inside it.'
    description: 'Optional: one line saying what the metric measures; for a ratio, what is divided by what.'
    object: Managed object type.
    layer: Layer that produces the metric.
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    interval: '20s: a VCF Operations peak, the highest of the 15 20-second averages in the 5-minute cycle; 5m: 5-minute average; 2s: esxtop. Every KPI is reported every 5 minutes.'
    operator: '>, >=, <, <=, =, range.'
    value: 'The number compared against; range: low end, value_high the high end.'
    unit: 'Unit of value: one of the finite set of units VCF Operations defines, never a new one. Its own part of the metric, apart from the name; the UI shows it in brackets after the name. A ratio or fraction has the unit number; what it divides by goes in description.'
    condition: Another condition that must hold at the same time.
    meaning: What the knowledge file says the value means.
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: Knowledge file that states and explains the threshold.
    quote: Only on rows whose number is still also written in prose; text copied from the kb file; lint checks it is still there.
    step: 'flow rows: the number of the step in the kb flow file (## Checks, in order) that compares the reading with value.'
  limits_fields: 'The one description of a line in a kpi, model or score section (this file, catalog/thresholds-capacity, catalog/thresholds-risk). One line per object and metric. Five limits per interval (5m, 20s, 2s): [best, green, yellow, orange, zero-at], the values where the score is 100, 75, 50, 25 and 0; null until entered. The green limit is where green ends and yellow starts; zero-at is where red ends. A limit is the end of a band: green runs from best to the green limit, yellow to the yellow limit, orange to the orange limit, red to zero-at. Inside a band the score falls in a straight line; better than best stays 100, worse than zero-at stays 0. Example [0, 2, 4, 8, 16]: green 0-2, yellow 2-4, orange 4-8, red 8-16, 16 and beyond scores 0. Green limit equal to best: only that value is green. The best limit is not always 0 (Worst ESXi CPU imbalance: 1). Same model and terms as the VCF-vCommunity-Adapter (docs/concepts/kpi-scoring-models.md, metrics/kpi_score.py). Entered by hand; the 4x rule is a guide for choosing a 20-second value from a 5-minute one, not a formula: it never fills a cell.
    direction above: higher is worse; below: lower is worse. Unit in the metric name; count for a number of things (VCF Operations unit). description: optional, what the metric measures. group: the group of the sub-metric (Score on a score line). excluded_when_green: left out of the score while green (the adapter''s skip when green). kb: the file that explains the metric; Agent E2 shows these values with it.'
  review_notes:
  - 'To check: kpi cells still null: green, yellow, orange, red, zero to enter by hand for each of 5m, 20s and 2s (Q152).'
  - 'To check: flow rows flow-esxi-disk-kernel-latency and flow-esxi-disk-device-latency: the knowledge base gives no sample interval (esxtop or the vCenter 20-second real-time chart); interval stays empty until a source states it.'
  - 'To check: the Memory Wait rows (VM Performance, Cluster Performance, ESXi Performance) score Memory Contention plus NVMe wait with limits set from Memory Contention only (cluster zero 8 and 4; VM zero 4); check them against NVMe wait on a tiered host. The ESXi Performance rows score Memory Wait as well.'
  status: reviewed
