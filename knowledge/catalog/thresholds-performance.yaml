flow:
- {id: flow-esxi-disk-kernel-latency, metric: "ESXi Disk Kernel Latency (KAVG)", object: HostSystem, layer: hypervisor, operator: '>', value: 0.5, unit: ms, meaning: "commands wait in the VMkernel, mostly in a queue: read QAVG and the queue depths at each level (step 2)", source: knowledge-base, kb: vsphere/technology/storage/troubleshooting/host-storage-latency, step: 1}
- {id: flow-esxi-disk-device-latency, metric: "ESXi Disk Device Latency (DAVG)", object: HostSystem, layer: physical, operator: '>', value: 5, unit: ms, meaning: "the time is spent from the HBA to the array and back: check the array, then the fabric or the HBA configuration (step 3)", source: knowledge-base, kb: vsphere/technology/storage/troubleshooting/host-storage-latency, step: 1}
change:
- {id: change-cluster-performance, metric: "Cluster Performance (%)", object: ClusterComputeResource, operator: '>=', value: 5, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
- {id: change-cluster-risk, metric: "Cluster Risk (%)", object: ClusterComputeResource, operator: '>=', value: 5, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
- {id: change-cluster-consumption, metric: "Cluster Consumption (%)", object: ClusterComputeResource, operator: '>=', value: 5, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
- {id: change-esxi-performance, metric: "ESXi Performance (%)", object: HostSystem, operator: '>=', value: 5, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
- {id: change-vm-performance, metric: "VM Performance (%)", object: VirtualMachine, layer: virtual-motherboard, operator: '>=', value: 8, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady. One VM's score moves more than a provider score: it has no breadth row to steady it", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
- {id: change-guest-os-performance, metric: "Guest OS Performance (%)", object: VirtualMachine, layer: guest-os, operator: '>=', value: 8, unit: '%', meaning: "a move of the score from the median of the window of at least this many points is a drop (or a rise); a smaller move is the score's normal movement, so the trend is steady. One VM's score moves more than a provider score: it has no breadth row to steady it", source: knowledge-base, kb: sp5-framework/performance/performance-kpi-design}
