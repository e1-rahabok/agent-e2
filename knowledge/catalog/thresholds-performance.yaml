meta:
  id: catalog/thresholds-performance
  title: 'Performance thresholds: contention and health'
  fields:
    id: Stable key.
    kind: 'rule: one value (above X means Y): SLA, SLI and alert rows. KPI colour levels are in levels.'
    metric: Metric as the knowledge file names it.
    object: Managed object type.
    layer: Layer that produces the metric (rules).
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    operator: 'rules: >, >=, <, <=, =, range.'
    value: 'rules: the number compared against; range: low end, value_high the high end.'
    unit: Unit of value.
    condition: 'rules: another condition that must hold at the same time.'
    meaning: 'rules: what the knowledge file says the value means.'
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: Knowledge file that states and explains the threshold.
    quote: 'Only on rows whose number is still also written in prose (alerts, capacity flow steps), until those move here; lint checks the copy.'
    interval: 20s (20-second peak) or 5m (5-minute average); 2s for esxtop; empty until a source states it.
    levels: 'KPI colour levels, the one place: no knowledge file repeats them. One line per object and metric: [yellow, orange, red] for 5m, 20s and 2s, entered by hand; null until entered; the 4x rule is a guide for choosing a 20-second value from a 5-minute one, not a formula: it never fills a cell. direction above: higher is worse; below: lower is worse. group: the KPI group. excluded_when_green: left out of the KPI score while green. kb: the KPI file that explains the metric; Agent E2 shows these values with it.'
  review_notes:
  - 'To check: levels cells still null: yellow, orange, red to enter by hand for each of 5m, 20s and 2s (Q152).'
  status: draft
rows:
- kind: rule
  id: performance-sla-gold
  metric: Performance SLA (Gold class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.9
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Gold class of service.
  source: knowledge-base
  kb: sp5-framework/performance/noisy-neighbour
- kind: rule
  id: performance-sla-silver
  metric: Performance SLA (Silver class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.8
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Silver class of service.
  source: knowledge-base
  kb: sp5-framework/performance/noisy-neighbour
- kind: rule
  id: performance-sla-bronze
  metric: Performance SLA (Bronze class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.6
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Bronze class of service.
  source: knowledge-base
  kb: sp5-framework/performance/noisy-neighbour
- kind: rule
  id: vm-sli-cpu-ready
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 2.5
  unit: '%'
  meaning: CPU SLI fails for this 5-minute interval (Performance SLA counter).
  source: knowledge-base
  kb: sp5-framework/concepts/sla-metrics
- kind: rule
  id: vm-sli-memory-contention
  metric: VM Memory Contention
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 1
  unit: '%'
  meaning: Memory SLI fails for this 5-minute interval (Performance SLA counter).
  source: knowledge-base
  kb: sp5-framework/concepts/sla-metrics
- kind: rule
  id: vm-sli-disk-latency
  metric: VM Disk Latency
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 10
  unit: 'ms'
  meaning: Disk SLI fails for this 5-minute interval (Performance SLA counter). Average of read and write.
  source: knowledge-base
  kb: sp5-framework/concepts/sla-metrics
- kind: rule
  id: vm-sli-network-tx-dropped
  metric: VM Network Transmit Dropped Packets
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 0
  unit: '%'
  meaning: Network SLI fails for this 5-minute interval (Performance SLA counter). Received drops are excluded.
  source: knowledge-base
  kb: sp5-framework/concepts/sla-metrics
- kind: rule
  id: alert-guest-os-cpu-queue-red
  metric: Guest OS Peak CPU Queue
  object: VirtualMachine
  layer: guest-os
  operator: '>'
  value: 20
  unit: threads
  condition: VM CPU Net Run above 75%, for 15 minutes
  meaning: Red alert (application team).
  source: knowledge-base
  kb: guest-os/system/configuration/guest-os-alerts
  quote: 'Red: for 15 minutes, Guest OS Peak CPU Queue above 20 and VM CPU Net Run above 75%.'
- kind: rule
  id: alert-guest-os-disk-queue-red
  metric: Guest OS Disk Queue (20-second peak)
  object: VirtualMachine
  layer: guest-os
  operator: '>'
  value: 10000
  unit: outstanding I/O
  condition: VM CPU Usage above 1 GHz, for 5 minutes
  meaning: Red alert (application team).
  source: knowledge-base
  kb: guest-os/system/configuration/guest-os-alerts
  quote: 'Red: for 5 minutes, 20-second peak Guest OS disk queue above 10,000 and VM CPU Usage above 1 GHz.'
  interval: 20s
- kind: rule
  id: alert-guest-os-disk-queue-orange
  metric: Guest OS Disk Queue (20-second peak)
  object: VirtualMachine
  layer: guest-os
  operator: '>'
  value: 5000
  unit: outstanding I/O
  condition: VM CPU Usage above 1 GHz, for 5 minutes
  meaning: Orange alert (application team).
  source: knowledge-base
  kb: guest-os/system/configuration/guest-os-alerts
  quote: 'Orange: for 5 minutes, 20-second peak Guest OS disk queue above 5,000 and VM CPU Usage above 1 GHz.'
  interval: 20s
- kind: rule
  id: alert-vm-cpu-ready-red
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 8
  unit: '%'
  condition: Peak vCPU Ready above 32%, CPU Contention above 8%, CPU Usage above 1 GHz
  meaning: Red VM CPU contention alert.
  source: knowledge-base
  kb: vsphere/technology/cpu/configuration/cpu-alerts
  quote: VM CPU Ready above 8%;
- kind: rule
  id: alert-vm-cpu-ready-orange
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 4
  unit: '%'
  condition: Peak vCPU Ready above 32%, CPU Contention above 8%, CPU Usage above 1 GHz
  meaning: Orange VM CPU contention alert.
  source: knowledge-base
  kb: vsphere/technology/cpu/configuration/cpu-alerts
  quote: VM CPU Ready above 4%;
- kind: rule
  id: alert-infra-cpu-peak-vcpu-ready-red
  metric: Peak vCPU Ready
  object: ClusterComputeResource
  layer: virtual-motherboard
  operator: '>'
  value: 24
  unit: '%'
  condition: CPU Contention above 6%
  meaning: Red infrastructure CPU contention alert (ESXi, resource pool, cluster).
  source: knowledge-base
  kb: vsphere/technology/cpu/configuration/cpu-alerts
  quote: Peak vCPU Ready above 24%;
  interval: 20s
- kind: rule
  id: alert-infra-cpu-peak-vcpu-ready-orange
  metric: Peak vCPU Ready
  object: ClusterComputeResource
  layer: virtual-motherboard
  operator: '>'
  value: 12
  unit: '%'
  condition: CPU Contention above 3%
  meaning: Orange infrastructure CPU contention alert (ESXi, resource pool, cluster).
  source: knowledge-base
  kb: vsphere/technology/cpu/configuration/cpu-alerts
  quote: Peak vCPU Ready above 12%;
  interval: 20s
- kind: rule
  id: alert-vm-cpu-net-run-red
  metric: VM CPU Net Run
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 95
  unit: '%'
  condition: Guest OS CPU Queue above 4, for 15 minutes
  meaning: Red VM CPU consumption alert.
  source: knowledge-base
  kb: vsphere/technology/cpu/configuration/cpu-alerts
  quote: VM CPU Net Run above 95%;
- kind: rule
  id: alert-vm-memory-contention-red
  metric: VM Memory Contention
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 6
  unit: '%'
  condition: Peak Memory Contention above 24%, CPU Usage above 1 GHz
  meaning: Red VM memory contention alert.
  source: knowledge-base
  kb: vsphere/technology/memory/configuration/memory-alerts
  quote: VM Memory Contention above 6%;
- kind: rule
  id: alert-vm-memory-contention-orange
  metric: VM Memory Contention
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 3
  unit: '%'
  condition: Peak Memory Contention above 12%, CPU Usage above 1 GHz
  meaning: Orange VM memory contention alert.
  source: knowledge-base
  kb: vsphere/technology/memory/configuration/memory-alerts
  quote: VM Memory Contention above 3%;
- kind: rule
  id: alert-infra-memory-contention-red
  metric: Memory Contention
  object: ClusterComputeResource
  layer: virtual-motherboard
  operator: '>'
  value: 4
  unit: '%'
  condition: Peak Memory Contention above 16%
  meaning: Red infrastructure memory contention alert (ESXi, resource pool, cluster).
  source: knowledge-base
  kb: vsphere/technology/memory/configuration/memory-alerts
  quote: Memory Contention above 4%.
- kind: rule
  id: alert-infra-memory-contention-orange
  metric: Memory Contention
  object: ClusterComputeResource
  layer: virtual-motherboard
  operator: '>'
  value: 2
  unit: '%'
  condition: Peak Memory Contention above 8%
  meaning: Orange infrastructure memory contention alert (ESXi, resource pool, cluster).
  source: knowledge-base
  kb: vsphere/technology/memory/configuration/memory-alerts
  quote: Memory Contention above 2%.
- kind: rule
  id: alert-vm-disk-latency-red
  metric: VM Disk Read or Write Latency (average)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 80
  unit: ms
  condition: Peak Disk Latency above 320 ms, CPU Usage above 1 GHz, IOPS of that direction above 100, for 10 minutes
  meaning: Red VM disk latency alert.
  source: knowledge-base
  kb: vsphere/technology/storage/configuration/storage-alerts
  quote: VM Disk Read Latency (average) above 80 ms;
- kind: rule
  id: alert-vm-disk-latency-orange
  metric: VM Disk Read or Write Latency (average)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 40
  unit: ms
  condition: Peak Disk Latency above 160 ms, CPU Usage above 1 GHz, IOPS of that direction above 100, for 10 minutes
  meaning: Orange VM disk latency alert.
  source: knowledge-base
  kb: vsphere/technology/storage/configuration/storage-alerts
  quote: VM Disk Read Latency (average) above 40 ms;
- kind: rule
  id: alert-vm-network-tx-dropped-red
  metric: VM Network Transmitted Packets Dropped
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 4
  unit: '%'
  meaning: Red VM network alert.
  source: knowledge-base
  kb: vsphere/technology/network/configuration/network-alerts
  quote: 'Red: transmitted packets dropped above 4%.'
  interval: 20s
- kind: rule
  id: alert-esxi-network-tx-dropped-red
  metric: ESXi Network Transmitted Packets Dropped
  object: HostSystem
  layer: hypervisor
  operator: '>'
  value: 50
  unit: packets
  condition: virtual or physical network, each
  meaning: Red ESXi network alert.
  source: knowledge-base
  kb: vsphere/technology/network/configuration/network-alerts
  quote: 'Red: more than 50 transmitted packets dropped on the virtual network.'
- kind: rule
  id: alert-dpg-dropped-red
  metric: Distributed Port Group Packets Dropped
  object: DistributedVirtualPortgroup
  layer: hypervisor
  operator: '>'
  value: 10
  unit: '%'
  meaning: Red distributed port group alert.
  source: knowledge-base
  kb: vsphere/technology/network/configuration/network-alerts
  quote: 'Red: dropped packets above 10%.'

