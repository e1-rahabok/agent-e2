meta:
  id: catalog/thresholds-performance
  title: 'Performance thresholds: KPI'
  sections:
    kpi: 'KPI colour levels, the one place: no knowledge file repeats them. Internal target, proactive, no class of service.'
  fields:
    id: Stable key, unique across the threshold files.
    metric: Metric as the knowledge file names it.
    object: Managed object type.
    layer: Layer that produces the metric.
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    interval: '20s: a VCF Operations peak, the highest of the 15 20-second averages in the 5-minute cycle; 5m: 5-minute average; 2s: esxtop. Every KPI is reported every 5 minutes.'
    operator: '>, >=, <, <=, =, range.'
    value: 'The number compared against; range: low end, value_high the high end.'
    unit: Unit of value.
    condition: Another condition that must hold at the same time.
    meaning: What the knowledge file says the value means.
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: Knowledge file that states and explains the threshold.
    quote: Only on rows whose number is still also written in prose; text copied from the kb file; lint checks it is still there.
  kpi_fields: 'One line per object and metric: [yellow, orange, red] for 5m, 20s and 2s, entered by hand; null until entered; the 4x rule is a guide for choosing a 20-second value from a 5-minute one, not
    a formula: it never fills a cell. direction above: higher is worse; below: lower is worse. group: the KPI group. excluded_when_green: left out of the KPI score while green. kb: the KPI file that explains
    the metric; Agent E2 shows these values with it.'
  review_notes:
  - 'To check: kpi cells still null: yellow, orange, red to enter by hand for each of 5m, 20s and 2s (Q152).'
  status: draft
