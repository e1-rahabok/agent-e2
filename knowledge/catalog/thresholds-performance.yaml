meta:
  id: catalog/thresholds-performance
  title: 'Performance thresholds: contention and health'
  fields:
    id: Stable key.
    kind: 'rule (one value: above X means Y) or bands (colour bands).'
    metric: Metric as the knowledge file names it.
    object: Managed object type.
    layer: Layer that produces the metric (rules).
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    operator: 'rules: >, >=, <, <=, =, range.'
    value: 'rules: the number compared against; range: low end, value_high the high end.'
    unit: Unit of value.
    condition: 'rules: another condition that must hold at the same time.'
    meaning: 'rules: what the knowledge file says the value means.'
    group: 'bands: the group column of the source table (for example Utilization, Depth).'
    source: book, author, vsphere-9.1-docs, performance-best-practices-9.1, microsoft.
    kb: Knowledge file that states and explains the threshold.
    quote: 'rules: text copied from the kb file; lint checks it is still there.'
    interval: 20s (20-second peak) or 5m (5-minute average); 2s for esxtop; empty until a source states it.
    bands: green, yellow, orange, red; grey is not used for performance.
  review_notes:
  - 'Author rule (2026-11-06): a 20-second threshold is generally about 4x the 5-minute threshold, because a spike does not sustain for 300 seconds. The rule is stated,
    not used to fill values: each row carries only what its source gives.'
  - Every row restates a threshold written in its kb file. Band rows must match the colour-band table of the kb file; lint checks both ways.
  - Merged 2026-11-06 from catalog/thresholds.yaml and the KPI band tables (one place for thresholds).
  - 'Intervals of KPI and SLI rows (author, Q048, 2026-11-06): a VCF Operations metric named ''peak'' is the highest of the 15 20-second averages in the 5-minute
    cycle (20s); every KPI and SLI is reported every 5 minutes (5m). The SLA is a lagging, monthly indicator.'
  status: draft
rows:
- kind: rule
  id: performance-sla-gold
  metric: Performance SLA (Gold class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.9
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Gold class of service.
  source: author
  kb: sp5-framework/performance/noisy-neighbour
  quote: 'Performance SLA thresholds: Gold 99.9%, Silver 99.8%, Bronze 99.6%.'
- kind: rule
  id: performance-sla-silver
  metric: Performance SLA (Silver class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.8
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Silver class of service.
  source: author
  kb: sp5-framework/performance/noisy-neighbour
  quote: 'Performance SLA thresholds: Gold 99.9%, Silver 99.8%, Bronze 99.6%.'
- kind: rule
  id: performance-sla-bronze
  metric: Performance SLA (Bronze class)
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>='
  value: 99.6
  unit: '% (monthly mean of SLI)'
  meaning: Performance SLA threshold for the Bronze class of service.
  source: author
  kb: sp5-framework/performance/noisy-neighbour
  quote: 'Performance SLA thresholds: Gold 99.9%, Silver 99.8%, Bronze 99.6%.'
- kind: rule
  id: vm-sli-cpu-ready
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 2.5
  unit: '%'
  meaning: CPU SLI fails for this 5-minute interval (Performance SLA counter).
  source: book
  kb: sp5-framework/concepts/sla-metrics
  quote: '| CPU | Ready | above 2.5% |'
- kind: rule
  id: vm-sli-memory-contention
  metric: VM Memory Contention
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 1
  unit: '%'
  meaning: Memory SLI fails for this 5-minute interval (Performance SLA counter).
  source: book
  kb: sp5-framework/concepts/sla-metrics
  quote: '| Memory | Contention | above 1% |'
- kind: rule
  id: vm-sli-disk-latency
  metric: VM Disk Latency
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 10
  unit: 'ms'
  meaning: Disk SLI fails for this 5-minute interval (Performance SLA counter). Average of read and write.
  source: book
  kb: sp5-framework/concepts/sla-metrics
  quote: '| Disk | Latency | above 10 ms |'
- kind: rule
  id: vm-sli-network-tx-dropped
  metric: VM Network Transmit Dropped Packets
  object: VirtualMachine
  layer: virtual-motherboard
  instance: aggregate (VM level, not per vCPU or per virtual disk)
  interval: 5m
  operator: '>'
  value: 0
  unit: '%'
  meaning: Network SLI fails for this 5-minute interval (Performance SLA counter). Received drops are excluded.
  source: book
  kb: sp5-framework/concepts/sla-metrics
  quote: '| Network | Transmit dropped packets | above 0% |'
- kind: rule
  id: vm-cpu-ready-poor
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 50
  unit: '%'
  condition: high VM CPU Usage
  meaning: Poor performance.
  source: book
  kb: vsphere/technology/cpu/metrics/virtual-motherboard/ready
  quote: Ready above 50% with high Usage results in poor performance.
- kind: rule
  id: vm-cpu-ready-usage-docs
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 20
  unit: '%'
  condition: VM CPU Usage above 90%
  meaning: Performance is impacted (documentation reading; the knowledge base reads Ready against Run).
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: '| VM CPU Usage above 90% and VM CPU Ready above 20% | Performance is impacted. |'
- kind: rule
  id: vm-cpu-costop-high-performing
  metric: VM CPU Co-stop
  object: VirtualMachine
  layer: virtual-motherboard
  operator: <
  value: 1
  unit: '%'
  meaning: Level in a high-performing environment.
  source: book
  kb: vsphere/technology/cpu/metrics/virtual-motherboard/co-stop
  quote: In a high-performing environment Co-stop stays below 1%.
- kind: rule
  id: vm-cpu-contention-high
  metric: VM CPU Contention
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 37.5
  unit: '%'
  meaning: Contention high. Next check Guest OS Run Queue, Context Switch, CPU Usage, VM Ready and Co-stop.
  source: book
  kb: vsphere/technology/cpu/troubleshooting/vm-cpu-contention-high
  quote: Contention high (above 37.5%)
- kind: rule
  id: vm-cpu-usage-above-run
  metric: VM CPU Usage
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 90
  unit: '%'
  condition: VM CPU Run below 90%
  meaning: Likely Turbo, not demand. Not a reason to add vCPUs.
  source: book
  kb: vsphere/technology/cpu/health-check/oversized-vm-downsizing
  quote: Usage above 90% with Run below 90% is likely Turbo, not demand.
- kind: rule
  id: vm-cpu-ready-with-zero-latency
  metric: VM CPU Ready
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 15
  unit: '%'
  condition: VM CPU Latency near 0%
  meaning: A limit. Latency excludes limit time.
  source: book
  kb: vsphere/technology/cpu/metrics/virtual-motherboard/latency
  quote: 'Latency near 0% with Ready above 15%: a limit.'
- kind: rule
  id: host-cpu-cores-free
  metric: ESXi Core Utilization
  object: HostSystem
  layer: hypervisor
  operator: <
  value: 100
  unit: '%'
  condition: or ESXi Thread Utilization below 50%
  meaning: Physical cores are still free. New VMs can go on.
  source: book
  kb: vsphere/technology/cpu/health-check/host-cpu-capacity-headroom
  quote: 'Core Utilization below 100% or Thread Utilization below 50%: physical cores are still free.'
- kind: rule
  id: host-cpu-thread-utilization-target
  metric: ESXi Thread Utilization
  object: HostSystem
  layer: hypervisor
  operator: range
  value: 80
  value_high: 90
  unit: '%'
  condition: Core Utilization at 100%
  meaning: Level the author keeps per host. Cluster level is lower.
  source: book
  kb: vsphere/technology/cpu/health-check/host-cpu-capacity-headroom
  quote: The author keeps it around 80%-90% per host
- kind: rule
  id: host-memory-usage-docs
  metric: ESXi Memory Usage
  object: HostSystem
  layer: hypervisor
  operator: '>='
  value: 94
  unit: '%'
  condition: consistently; and balloon or swap high
  meaning: Host probably short of memory. Without high balloon and swap, performance is probably not affected.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: '| Host memory usage consistently 94% or higher |'
- kind: rule
  id: memory-usage-low-docs
  metric: Memory Usage
  operator: <=
  value: 24
  unit: '%'
  condition: consistently
  meaning: Memory size probably too large.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: '| Memory usage consistently 24% or lower | Memory size probably too large. |'
- kind: rule
  id: host-free-memory-docs
  metric: ESXi Free Memory
  object: HostSystem
  layer: hypervisor
  operator: <=
  value: 6
  unit: '%'
  condition: with frequent swapping
  meaning: Host cannot meet the combined active memory of its VMs. Reclamation degrades performance.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: '| Host free memory 6% or less, with frequent swapping |'
- kind: rule
  id: kavg-book
  metric: KAVG
  object: HostSystem
  layer: hypervisor
  operator: '>'
  value: 0.5
  unit: ms
  meaning: Check QAVG and the queue depths at each level of the stack.
  source: book
  kb: vsphere/technology/storage/troubleshooting/host-storage-latency
  quote: 'KAVG above 0.5 ms: check QAVG and the queue depths at each level of the stack.'
- kind: rule
  id: davg-book
  metric: DAVG
  object: HostSystem
  layer: physical
  operator: <
  value: 5
  unit: ms
  meaning: Healthy is well within 5 ms; lower with SSD.
  source: book
  kb: vsphere/technology/storage/concepts/esxi-storage-latency-stack
  quote: Well within 5 ms; lower with SSD.
- kind: rule
  id: kernel-latency-docs
  metric: kernelLatency (KAVG)
  object: HostSystem
  layer: hypervisor
  operator: '>'
  value: 4
  unit: ms
  meaning: VMs send more throughput than the configuration supports. Best is 0-1 ms.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: Best 0-1 ms. Above 4 ms
- kind: rule
  id: device-latency-docs
  metric: deviceLatency (DAVG)
  object: HostSystem
  layer: physical
  operator: '>'
  value: 15
  unit: ms
  meaning: Probable array problem, depending on the hardware. The value comes from spinning-disk arrays.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: 'Above 15 ms, depending on the hardware: probable array problem.'
- kind: rule
  id: queue-latency-docs
  metric: queueLatency (QAVG)
  object: HostSystem
  layer: hypervisor
  operator: '>'
  value: 0
  unit: ms
  meaning: Workload too high; the array cannot process data fast enough. Must always be 0.
  source: vsphere-9.1-docs
  kb: vsphere/tools/vsphere-client/performance-guidance
  quote: Must always be 0.
- kind: rule
  id: sql-server-disk-latency
  metric: SQL Server disk latency (application layer)
  operator: range
  value: 10
  value_high: 15
  unit: ms
  meaning: Microsoft guidance at the SQL Server layer. Lower at the Windows layer, lower still at the VM layer.
  source: microsoft
  kb: observability/thresholds
  quote: 'Microsoft guidance for SQL Server: disk latency should consistently stay within 10–15 ms.'
- kind: rule
  id: drs-score-healthy
  metric: Cluster DRS Score
  object: ClusterComputeResource
  operator: '>'
  value: 80
  unit: '%'
  meaning: No performance impact.
  source: performance-best-practices-9.1
  kb: vsphere/object-types/cluster/configuration/drs-migration-levels
  quote: 'Score above 80%: the source indicates no performance impact.'
- kind: rule
  id: drs-score-degraded
  metric: Cluster DRS Score
  object: ClusterComputeResource
  operator: <
  value: 80
  unit: '%'
  meaning: Potential performance degradation in one or more cluster workloads.
  source: performance-best-practices-9.1
  kb: vsphere/object-types/cluster/configuration/drs-migration-levels
  quote: 'Score below 80%: potential performance degradation in one or more cluster workloads.'
- kind: rule
  id: cluster-unreserved-capacity
  metric: Unreserved cluster capacity
  object: ClusterComputeResource
  operator: '>='
  value: 10
  unit: '%'
  meaning: Documentation advice for admission control.
  source: vsphere-9.1-docs
  kb: vsphere/object-types/cluster/concepts/admission-control-and-cluster-state
  quote: The documentation advises leaving at least 10% of capacity unreserved.
- kind: rule
  id: windows-committed
  metric: Windows % Committed
  layer: guest-os
  operator: <
  value: 80
  unit: '%'
  meaning: Keep below 80%. Performance drops at 90%.
  source: book
  kb: guest-os/memory/concepts/windows-memory
  quote: '| % Committed | Keep below 80%. Performance drops at 90%.'
- kind: rule
  id: windows-system-calls
  metric: Windows System Calls/sec
  layer: guest-os
  operator: '>'
  value: 20000
  unit: per core
  meaning: High. Usually below 2,000.
  source: book
  kb: guest-os/cpu/metrics/processor-time
  quote: Above 20,000 per core is high; usually below 2,000.
- kind: rule
  id: windows-privileged-time
  metric: Windows Privileged Time
  layer: guest-os
  operator: '>'
  value: 30
  unit: '%'
  condition: together with high System Calls/sec
  meaning: Too much OS work.
  source: book
  kb: guest-os/cpu/metrics/processor-time
  quote: 'High together with Privileged Time above 30%: too much OS work.'
