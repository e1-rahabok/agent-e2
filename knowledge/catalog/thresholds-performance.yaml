flow:
- {id: flow-esxi-nvme-read-sustained, metric: "ESXi NVMe read bandwidth", object: HostSystem, layer: hypervisor, operator: '>', value: 200, unit: MBps, condition: "second reading, at least one hour after the first", gap_minutes: 60, meaning: "sustained: the working set no longer fits the DRAM left; at or below it, a warm-up after an idle period", source: knowledge-base, kb: vsphere/technology/memory/decision-tree/is-memory-tiering-slowing-host, step: 3}
- {id: flow-esxi-disk-kernel-latency, metric: "ESXi Disk Kernel Latency (KAVG)", object: HostSystem, layer: hypervisor, operator: '>', value: 0.5, unit: ms, meaning: "commands wait in the VMkernel, mostly in a queue: read QAVG and the queue depths at each level (step 2)", source: knowledge-base, kb: vsphere/technology/storage/troubleshooting/host-storage-latency, step: 1}
- {id: flow-esxi-disk-device-latency, metric: "ESXi Disk Device Latency (DAVG)", object: HostSystem, layer: physical, operator: '>', value: 5, unit: ms, meaning: "the time is spent from the HBA to the array and back: check the array, then the fabric or the HBA configuration (step 3)", source: knowledge-base, kb: vsphere/technology/storage/troubleshooting/host-storage-latency, step: 1}
