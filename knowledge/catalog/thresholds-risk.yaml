meta:
  id: catalog/thresholds-risk
  title: 'Cluster Risk: its sub-metrics and its score'
  sections:
    model: 'The sub-metrics of Cluster Risk, five limits each: the same line format as the kpi section of catalog/thresholds-performance (meta, limits_fields). Cluster Risk links performance and capacity: it reads how close the hosts are to contention, so it has a file of its own.'
    score: 'The limits of the Cluster Risk score itself (0-100%, higher is worse: published as 100 minus the weighted average). Same line format.'
  review_notes: []
  status: reviewed
