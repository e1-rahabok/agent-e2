meta:
  id: catalog/objects
  title: vSphere object model for multi-hop questions
  fields:
    type: Managed object type, as in project/tools/tags.yaml.
    role: provider (supplies a resource), consumer (uses one), or both. container objects only group others.
    layer: Layer that produces the object's own metrics, as in project/tools/tags.yaml.
    supplies: Resources the object provides to the objects below it.
    charts: Whether vCenter keeps performance charts for the object.
    kb: Knowledge files that explain the object's metrics or behaviour.
    relations: Edges. kind is contains (inventory), resource-parent (resource hierarchy), runs-on, mounts, stores-files-on, connects-to. cardinality reads from -> to.
  review_notes:
  - 'To check: object types and relationships without a kb file, against the vSphere 9.1 API reference.'
  - Many-to-many relationships between VM, datastore, host and cluster follow vsphere/architecture/object-relationships.
  - Provider and consumer roles follow vsphere/architecture/provider-consumer.
  - No performance charts for distributed switches and port groups follows vsphere/tools/vsphere-client/vcenter-statistics, section Chart behaviour.
  - Datacenter, Datastore and StoragePod chart notes follow the vSphere 9.1 chart tables (catalog/vcenter-counters).
  status: draft
layers:
- layer: guest-os
  runs_on: virtual-motherboard
  note: Windows or Linux. Not a managed object. Its metrics come from inside the guest. See vsphere/architecture/vm-vs-guest-os.
- layer: virtual-motherboard
  runs_on: hypervisor
  note: The VM. A consumer of the host and the provider of virtual hardware to the Guest OS.
- layer: hypervisor
  runs_on: physical
  note: ESXi (VMkernel). Provider to the VMs.
- layer: physical
  runs_on: null
  note: Cores, threads, DIMMs, NVMe, HBAs, NICs, arrays.
objects:
- type: vSphereWorld
  role: container
  charts: false
  note: Root that groups all vCenter instances (VCF Operations view).
- type: VCenterServer
  role: container
  charts: false
  kb: [vsphere/tools/vsphere-client/vcenter-statistics]
- type: Datacenter
  role: container
  charts: true
  note: Charts show the top 10 clusters by CPU and memory, and space by file type.
- type: Folder
  role: container
  charts: false
- type: ClusterComputeResource
  role: provider
  layer: hypervisor
  supplies: [cpu, memory]
  charts: true
  note: Aggregate of its hosts. Totals across cluster, host, VM and datastore do not reconcile because of many-to-many relationships.
  kb: [vsphere/object-types/cluster/concepts/drs-overview, vsphere/object-types/cluster/concepts/cluster-operations, vsphere/object-types/cluster/cluster-performance]
- type: ResourcePool
  role: both
  supplies: [cpu, memory]
  charts: true
  note: Consumer of the cluster or host, provider to its child pools and VMs. Can apply limits unintentionally.
  kb: [vsphere/architecture/resource-controls]
- type: HostSystem
  role: provider
  layer: hypervisor
  supplies: [cpu, memory, storage-path, network]
  charts: true
  note: ESXi metrics are not the sum of VM metrics plus kernel. Ready does not apply to ESXi.
  kb: [vsphere/architecture/provider-consumer, vsphere/architecture/overhead]
- type: VirtualMachine
  role: both
  layer: virtual-motherboard
  supplies: [vcpu, guest-physical-memory, virtual-disk, vnic]
  charts: true
  note: Consumer of its host, resource pool and datastores. Provider of the virtual motherboard to the Guest OS.
  kb: [vsphere/architecture/vm-vs-guest-os, vsphere/architecture/provider-consumer]
- type: Datastore
  role: provider
  supplies: [storage]
  charts: true
  note: Space charts show the latest value only; space is refreshed every 30 minutes.
  kb: [vsphere/technology/storage/metrics/datastore/storage-io-control, vsphere/architecture/object-relationships]
- type: StoragePod
  role: container
  charts: true
  note: Datastore cluster. Charts show the top 10 datastores.
- type: VmwareDistributedVirtualSwitch
  role: provider
  supplies: [network]
  charts: false
- type: DistributedVirtualPortgroup
  role: container
  charts: false
relations:
- {from: vSphereWorld, to: VCenterServer, kind: contains, cardinality: one-to-many}
- {from: VCenterServer, to: Datacenter, kind: contains, cardinality: one-to-many}
- {from: Datacenter, to: Folder, kind: contains, cardinality: one-to-many}
- {from: Datacenter, to: ClusterComputeResource, kind: contains, cardinality: one-to-many}
- {from: Datacenter, to: Datastore, kind: contains, cardinality: one-to-many}
- {from: Datacenter, to: StoragePod, kind: contains, cardinality: one-to-many}
- {from: Datacenter, to: VmwareDistributedVirtualSwitch, kind: contains, cardinality: one-to-many}
- {from: StoragePod, to: Datastore, kind: contains, cardinality: one-to-many}
- {from: ClusterComputeResource, to: HostSystem, kind: contains, cardinality: one-to-many}
- {from: ClusterComputeResource, to: ResourcePool, kind: resource-parent, cardinality: one-to-many}
- {from: ResourcePool, to: ResourcePool, kind: resource-parent, cardinality: one-to-many}
- {from: ResourcePool, to: VirtualMachine, kind: resource-parent, cardinality: one-to-many}
- {from: VirtualMachine, to: HostSystem, kind: runs-on, cardinality: many-to-one}
- {from: HostSystem, to: Datastore, kind: mounts, cardinality: many-to-many}
- {from: VirtualMachine, to: Datastore, kind: stores-files-on, cardinality: many-to-many}
- {from: HostSystem, to: VmwareDistributedVirtualSwitch, kind: connects-to, cardinality: many-to-many}
- {from: VmwareDistributedVirtualSwitch, to: DistributedVirtualPortgroup, kind: contains, cardinality: one-to-many}
- {from: VirtualMachine, to: DistributedVirtualPortgroup, kind: connects-to, cardinality: many-to-many}
