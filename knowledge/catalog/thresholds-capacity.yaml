meta:
  id: catalog/thresholds-capacity
  title: 'Capacity thresholds: utilization, saturation, reservation, allocation, rightsizing'
  fields:
    id: Stable key.
    kind: 'rule (one value: above X means Y) or bands (colour bands).'
    metric: Metric as the knowledge file names it.
    object: Managed object type.
    layer: Layer that produces the metric (rules).
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    operator: 'rules: >, >=, <, <=, =, range.'
    value: 'rules: the number compared against; range: low end, value_high the high end.'
    unit: Unit of value.
    condition: 'rules: another condition that must hold at the same time.'
    meaning: 'rules: what the knowledge file says the value means.'
    group: 'bands: the group column of the source table (for example Utilization, Depth).'
    source: book, author, vsphere-9.1-docs, performance-best-practices-9.1, microsoft.
    kb: Knowledge file that states and explains the threshold.
    quote: 'rules: text copied from the kb file; lint checks it is still there.'
    interval: 'Usually empty: capacity reads sustained values.'
    bands: 'grey (below green: wastage), green, yellow, orange, red (author, 2026-11-06). Grey is empty until a source gives it.'
  review_notes:
  - 'Capacity has 5 bands: grey sits below green and marks wastage, used for rightsizing (author, 2026-11-06).'
  - Every row restates a threshold written in its kb file. Band rows must match the colour-band table of the kb file; lint checks both ways.
  - Merged 2026-11-06 from catalog/thresholds.yaml and the KPI band tables (one place for thresholds).
  - 'Intervals of KPI and SLI rows (author, Q048, 2026-11-06): a VCF Operations metric named ''peak'' is the highest of the 15 20-second averages in the 5-minute
    cycle (20s); every KPI and SLI is reported every 5 minutes (5m). The SLA is a lagging, monthly indicator.'
  status: draft
rows:
- kind: rule
  id: tiering-active-ideal
  metric: Active memory on a memory tiering host
  object: HostSystem
  layer: hypervisor
  operator: <=
  value: 50
  unit: '% of host DRAM'
  meaning: Ideal.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: 'ideal: no more than 50% of the host DRAM capacity'
- kind: rule
  id: tiering-active-suffer
  metric: Active memory on a memory tiering host
  object: HostSystem
  layer: hypervisor
  operator: '>='
  value: 75
  unit: '% of host DRAM'
  meaning: Some workloads begin to suffer.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: some workloads do not begin to suffer until active memory approaches 75%
- kind: rule
  id: tiering-nvme-latency-ideal
  metric: NVMe read latency (memory tiering)
  object: HostSystem
  layer: physical
  operator: <
  value: 200
  unit: µs
  meaning: Ideal.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: 'ideal: below 200 microseconds'
- kind: rule
  id: tiering-nvme-latency-suffer
  metric: NVMe read latency (memory tiering)
  object: HostSystem
  layer: physical
  operator: '>='
  value: 400
  unit: µs
  meaning: Some workloads begin to suffer.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: some workloads do not begin to suffer until latency approaches 400 microseconds
- kind: rule
  id: tiering-nvme-bandwidth-watch
  metric: NVMe read bandwidth (memory tiering)
  object: HostSystem
  layer: physical
  operator: '>'
  value: 200
  unit: MB/s
  meaning: Start watching NVMe device latency.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: 'NVMe read bandwidth above 200 MB/s: start watching NVMe device latency'
- kind: rule
  id: tiering-large-vm
  metric: VM memory size on a tiered host
  object: VirtualMachine
  layer: virtual-motherboard
  operator: '>'
  value: 512
  unit: GB
  condition: and 64 vCPUs
  meaning: Can degrade on a tiered host. Disable tiering for the VM, with a full memory reservation.
  source: performance-best-practices-9.1
  kb: vsphere/technology/memory/concepts/memory-tiering
  quote: VMs with more than 512 GB of memory and 64 vCPUs can degrade on a tiered host.
- kind: rule
  id: monster-vm-cpu
  metric: VM vCPU count relative to host physical cores
  object: VirtualMachine
  operator: '>'
  value: 50
  unit: '% of physical cores (not threads)'
  meaning: Monster VM (vCommunity adapter default, author 2026-11-05). Cores, not threads.
  source: author
  kb: vcf-operations/models/cluster-risk
  quote: '| CPU | 50% of the host''s physical cores. Cores, not threads. |'
  interval: 5m
- kind: rule
  id: monster-vm-memory
  metric: VM memory relative to host physical RAM
  object: VirtualMachine
  operator: '>'
  value: 40
  unit: '% of host DRAM, or 256 GB, whichever is smaller'
  meaning: Monster VM (vCommunity adapter default, author 2026-11-05). DRAM only; NVMe tiering does not count.
  source: author
  kb: vcf-operations/models/cluster-risk
  quote: '| Memory | 40% of the host''s DRAM, or 256 GB, whichever is smaller.'
  interval: 5m
