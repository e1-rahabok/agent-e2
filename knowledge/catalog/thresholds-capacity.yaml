decisions:
- id: closure-cluster-consumption-red
  metric: Cluster Consumption (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 80
  unit: '%'
  condition: production and non-production
  meaning: Red. Cluster closed for new VMs and VM upsize.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Consumption (%) (`vsphere/object-types/cluster/models/cluster-consumption`): red above 80%, orange above 60%.'
- id: closure-cluster-consumption-orange
  metric: Cluster Consumption (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 60
  unit: '%'
  condition: production and non-production
  meaning: Orange. With Cluster Performance also orange, the risk check decides.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Consumption (%) (`vsphere/object-types/cluster/models/cluster-consumption`): red above 80%, orange above 60%.'
- id: closure-cluster-performance-red
  metric: Cluster Performance (%), 5th percentile of the last 24 hours (higher is better)
  object: ClusterComputeResource
  operator: <
  value: 20
  unit: '%'
  condition: production and non-production
  meaning: Red. Cluster closed for new VMs and VM upsize.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Performance (%) (`vsphere/object-types/cluster/cluster-performance`): red below 20%, orange below 40%.'
- id: closure-cluster-performance-orange
  metric: Cluster Performance (%), 5th percentile of the last 24 hours (higher is better)
  object: ClusterComputeResource
  operator: <
  value: 40
  unit: '%'
  condition: production and non-production
  meaning: Orange. With Cluster Consumption also orange, the risk check decides.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Performance (%) (`vsphere/object-types/cluster/cluster-performance`): red below 20%, orange below 40%.'
- id: closure-cluster-risk-prod
  metric: Cluster Risk (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 60
  unit: '%'
  condition: production cluster; Cluster Consumption and Cluster Performance both orange
  meaning: Orange. Production cluster closed.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'production: above 60% (orange) → no: closed;'
- id: closure-cluster-risk-nonprod
  metric: Cluster Risk (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 80
  unit: '%'
  condition: non-production cluster; Cluster Consumption and Cluster Performance both orange
  meaning: Red. Non-production cluster closed.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'non-production: above 80% (red) → no: closed.'
rules:
- id: monster-vm-cpu
  metric: VM vCPU count relative to host physical cores
  object: VirtualMachine
  operator: '>'
  value: 50
  unit: '% of physical cores (not threads)'
  meaning: Monster VM (default). Cores, not threads.
  source: knowledge-base
  kb: vsphere/object-types/cluster/models/cluster-risk
  quote: '| CPU | 50% of the host''s physical cores. Cores, not threads. |'
  interval: 5m
- id: monster-vm-memory
  metric: VM memory relative to host physical RAM
  object: VirtualMachine
  operator: '>'
  value: 40
  unit: '% of host DRAM, or 256 GB, whichever is smaller'
  meaning: Monster VM (default). DRAM only; NVMe tiering does not count.
  source: knowledge-base
  kb: vsphere/object-types/cluster/models/cluster-risk
  quote: '| Memory | 40% of the host''s DRAM, or 256 GB, whichever is smaller.'
  interval: 5m
- id: idle-vm-cpu
  metric: VM CPU consumption per day (Idle VM policy)
  object: VirtualMachine
  operator: <=
  value: 100
  unit: MHz
  condition: 100% of the time, every day for 7 days; VM older than 30 days
  meaning: Idle VM (VCF Operations policy default).
  source: knowledge-base
  kb: vsphere/technology/cpu/metrics/virtual-motherboard/idle-vm
  quote: '| Within each day it consumes no more than | 100 MHz CPU |'
  interval: 5m
- id: datastore-mission-critical-vm-concentration
  metric: Mission-critical VMs per datastore
  object: Datastore
  operator: <
  value: 250
  unit: count
  meaning: Concentration risk cap (example policy).
  source: knowledge-base
  kb: sp5-framework/capacity/capacity-management
  quote: 'concentration risk: fewer than 250 mission-critical VMs per datastore'
- id: large-vm-fleet-average-cpu-oversized
  metric: Average CPU workload among large VMs (super metric)
  object: VirtualMachine
  operator: <
  value: 20
  unit: '%'
  condition: all month, 5-minute values, group of hundreds of large VMs
  meaning: All large VMs oversized. About 40% indicates correct sizing.
  source: knowledge-base
  kb: sp5-framework/capacity/rightsizing
  quote: '| Average CPU workload among the VMs | About 40% | Below 20% all month: all large VMs oversized |'
  interval: 5m
- id: host-cpu-cores-free
  metric: ESXi Core Utilization
  object: HostSystem
  layer: hypervisor
  operator: <
  value: 100
  unit: '%'
  condition: or ESXi Thread Utilization below 50%
  meaning: Physical cores are still free. New VMs can go on.
  source: knowledge-base
  kb: vsphere/technology/cpu/decision-tree/host-cpu-capacity-headroom
  quote: 'Core Utilization below 100% or Thread Utilization below 50%: physical cores are still free.'
- id: host-cpu-thread-utilization-target
  metric: ESXi Thread Utilization
  object: HostSystem
  layer: hypervisor
  operator: range
  value: 80
  value_high: 90
  unit: '%'
  condition: Core Utilization at 100%
  meaning: Level to keep per host. Cluster level is lower.
  source: knowledge-base
  kb: vsphere/technology/cpu/decision-tree/host-cpu-capacity-headroom
  quote: Keep it around 80%-90% per host
- id: planning-gold-cpu-overcommit
  metric: CPU overcommit ratio (allocation), vCPU per physical thread
  object: VirtualMachine
  operator: '='
  value: 1
  condition: Gold class of service, planning stage
  meaning: 'Allocation model: vCPU sold per physical thread, against usable threads.'
  source: knowledge-base
  kb: sp5-framework/capacity/class-of-service-planning
- id: planning-gold-memory-overcommit
  metric: Memory overcommit ratio (allocation), GB of VM memory per GB of usable DRAM
  object: VirtualMachine
  operator: '='
  value: 1
  condition: Gold class of service, planning stage
  meaning: 'Allocation model: VM memory sold per GB of usable DRAM; memory tiering is added on top.'
  source: knowledge-base
  kb: sp5-framework/capacity/class-of-service-planning
- id: planning-gold-cpu-reservation
  metric: CPU reservation, fraction of configured vCPU × base GHz
  object: VirtualMachine
  operator: '='
  value: 0.5
  condition: Gold class of service, planning stage
  meaning: 'Reservation model: share of each VM CPU reserved at the resource pool, at the base clock.'
  source: knowledge-base
  kb: sp5-framework/capacity/class-of-service-planning
- id: planning-gold-memory-reservation
  metric: Memory reservation, fraction of configured memory
  object: VirtualMachine
  operator: '='
  value: 1.0
  condition: Gold class of service, planning stage
  meaning: 'Reservation model: share of each VM memory reserved at the resource pool.'
  source: knowledge-base
