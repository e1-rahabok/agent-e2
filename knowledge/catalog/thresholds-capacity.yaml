meta:
  id: catalog/thresholds-capacity
  title: 'Capacity thresholds: models, decisions, planning rules'
  sections:
    models: Capacity and risk model inputs with colour bands (grey for wastage, green, yellow, orange, red).
    decisions: 'Close for business: when a cluster takes no more VMs. Reads model and KPI scores over 24 hours.'
    rules: 'Planning and sizing rules: one value, above X means Y.'
  fields:
    id: Stable key.
    metric: Metric as the knowledge file names it.
    object: Managed object type.
    layer: Layer that produces the metric.
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    operator: '>, >=, <, <=, =, range.'
    value: 'The number compared against; range: low end, value_high the high end.'
    unit: 'Unit of value. count for a number of things (threads, I/Os, packets, VMs, vCPU): the VCF Operations unit. Blank for a ratio or fraction: what it is a ratio of is in the metric name.'
    condition: Another condition that must hold at the same time.
    meaning: What the knowledge file says the value means.
    group: 'models: the group column of the source table (for example Utilization, Depth).'
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: Knowledge file that states and explains the threshold.
    quote: Text copied from the kb file; lint checks it is still there.
    interval: 'Usually empty: capacity reads sustained values.'
    bands: 'grey (below green: wastage), green, yellow, orange, red. Grey is empty until a source gives it.'
  review_notes:
  - 'To check: grey (wastage) band values, empty until a source gives them.'
  status: reviewed
