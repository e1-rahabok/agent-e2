- id: planning-gold-cpu-concurrent-peak
  metric: Expected concurrent peak CPU utilization of a VM, fraction of configured vCPU
  object: VirtualMachine
  operator: '='
  value: 0.35
  condition: Gold class of service, planning stage
  meaning: 'Utilization model: the share of configured vCPU busy at the same time across the VMs of the class.'
  source: knowledge-base
