meta:
  id: catalog/thresholds-capacity
  title: 'Capacity thresholds: Cluster Consumption, sizing, decisions, planning rules'
  sections:
    model: 'The sub-metrics of Cluster Consumption, five limits each: the same line format as the kpi section of catalog/thresholds-performance (meta, limits_fields). Cluster Risk has its own file, catalog/thresholds-risk.'
    score: 'The limits of the Cluster Consumption score itself (0-100%, higher is worse). Same line format.'
    sizing: 'Sizing ranges, two-sided: grey (below green: wastage), green, yellow, orange, red. Not a scored sub-metric: no score, no weight.'
    decisions: 'Close for business: when a cluster takes no more VMs. Reads model and KPI scores over 24 hours.'
    rules: 'Planning and sizing rules: one value, above X means Y.'
  fields:
    id: Stable key.
    group: 'Where the metric belongs (the group column of the source table, for example Utilization, Depth).'
    metric: 'The metric name as the knowledge file names it: the text a user reads. No comma, and no unit or description inside it.'
    key: 'Optional: the metric key the VCF Operations API uses, English only.'
    description: 'One line saying what the metric measures; for a ratio, what is divided by what.'
    object: Managed object type.
    layer: Layer that produces the metric.
    instance: 'Which reading: object aggregate, worst instance, percentile. Empty until a source states it.'
    operator: '>, >=, <, <=, =, range.'
    value: 'The number compared against; range: low end, value_high the high end.'
    unit: 'Unit of value: one of the finite set of units VCF Operations defines, never a new one. Its own part of the metric, apart from the name; the UI shows it in brackets after the name. A ratio or fraction has the unit number; what it divides by goes in description.'
    condition: Another condition that must hold at the same time.
    meaning: What the knowledge file says the value means.
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: Knowledge file that states and explains the threshold.
    quote: Text copied from the kb file; lint checks it is still there.
    interval: 'Usually empty: capacity reads sustained values.'
    bands: 'sizing rows: grey (below green: wastage), green, yellow, orange, red, each a range. Grey is empty until a source gives it.'
  review_notes:
  - 'To check: grey (wastage) band values, empty until a source gives them.'
  status: reviewed
model:
- {object: ClusterComputeResource, metric: "Cluster-wide ESXi CPU thread utilization (%)", group: "Utilization", direction: above, 5m: [0, 55, 70, 85, 100], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
- {object: ClusterComputeResource, metric: "Cluster-wide ESXi memory consumed (%)", description: "Consumed memory of all hosts ÷ their usable memory: DRAM, plus the NVMe tier on a tiered host, as vSphere counts host memory.", group: "Utilization", direction: above, 5m: [0, 70, 80, 90, 100], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
- {object: ClusterComputeResource, metric: "Cluster-wide ESXi DRAM Consumed (%)", description: "DRAM in use on all tiered hosts (Memory Consumed − NVMe tier in use) ÷ their usable DRAM. A separate metric from Memory Consumed.", group: "Utilization", direction: above, 5m: [0, 80, 85, 90, 100], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
- {object: ClusterComputeResource, metric: "Cluster memory tiering consumption (%)", description: "NVMe tier in use on all tiered hosts ÷ their usable DRAM (Total − HA − Buffer), not ÷ the NVMe tier.", group: "Saturation", direction: above, 5m: [0, 15, 30, 45, 60], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
- {object: ClusterComputeResource, metric: "Cluster-wide ESXi memory ballooned (%)", group: "Saturation", direction: above, 5m: [0, 1, 2, 4, 8], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
- {object: ClusterComputeResource, metric: "Cluster-wide ESXi swapped + zipped memory (%)", group: "Saturation", direction: above, 5m: [0, 0.25, 0.5, 1, 2], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
score:
- {object: ClusterComputeResource, metric: "Cluster Consumption (%)", group: "Score", direction: above, 5m: [0, 25, 50, 75, 100], 20s: null, 2s: null, kb: vsphere/object-types/cluster/models/cluster-consumption}
sizing:
- id: guest-os-sizing-guest-os-memory-utilization-for-sizing
  metric: Guest OS memory utilization for sizing (%)
  group: null
  object: null
  interval: null
  bands:
    grey: null
    green: 75-85
    yellow: 85-90
    orange: 90-95
    red: 95-100
  source: knowledge-base
  kb: guest-os/system/guest-os-sizing
decisions:
- id: closure-cluster-consumption-red
  metric: Cluster Consumption (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 80
  unit: '%'
  condition: production and non-production
  meaning: Red. Cluster closed for new VMs and VM upsize.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Consumption (%) (`vsphere/object-types/cluster/models/cluster-consumption`): red above 80%, orange above 60%.'
- id: closure-cluster-consumption-orange
  metric: Cluster Consumption (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 60
  unit: '%'
  condition: production and non-production
  meaning: Orange. With Cluster Performance also orange, the risk check decides.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Consumption (%) (`vsphere/object-types/cluster/models/cluster-consumption`): red above 80%, orange above 60%.'
- id: closure-cluster-performance-red
  metric: Cluster Performance (%), 5th percentile of the last 24 hours (higher is better)
  object: ClusterComputeResource
  operator: <
  value: 20
  unit: '%'
  condition: production and non-production
  meaning: Red. Cluster closed for new VMs and VM upsize.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Performance (%) (`vsphere/object-types/cluster/cluster-performance`): red below 20%, orange below 40%.'
- id: closure-cluster-performance-orange
  metric: Cluster Performance (%), 5th percentile of the last 24 hours (higher is better)
  object: ClusterComputeResource
  operator: <
  value: 40
  unit: '%'
  condition: production and non-production
  meaning: Orange. With Cluster Consumption also orange, the risk check decides.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'Cluster Performance (%) (`vsphere/object-types/cluster/cluster-performance`): red below 20%, orange below 40%.'
- id: closure-cluster-risk-prod
  metric: Cluster Risk (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 60
  unit: '%'
  condition: production cluster; Cluster Consumption and Cluster Performance both orange
  meaning: Orange. Production cluster closed.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'production: above 60% (orange) → no: closed;'
- id: closure-cluster-risk-nonprod
  metric: Cluster Risk (%), 95th percentile of the last 24 hours
  object: ClusterComputeResource
  operator: '>'
  value: 80
  unit: '%'
  condition: non-production cluster; Cluster Consumption and Cluster Performance both orange
  meaning: Red. Non-production cluster closed.
  source: knowledge-base
  kb: vsphere/object-types/cluster/decision-tree/can-cluster-take-more-vms
  quote: 'non-production: above 80% (red) → no: closed.'
rules:
- id: monster-vm-cpu
  metric: Monster VM CPU size
  object: VirtualMachine
  operator: '>'
  value: 50
  unit: '%'
  description: 'The VM''s vCPU count as a percentage of the host''s physical cores, not threads.'
  meaning: Monster VM (default). Cores, not threads.
  source: knowledge-base
  kb: vsphere/object-types/cluster/models/cluster-risk
  quote: '| CPU | 50% of the host''s physical cores. Cores, not threads. |'
  interval: 5m
- id: monster-vm-memory
  metric: Monster VM memory size
  object: VirtualMachine
  operator: '>'
  value: 40
  unit: '%'
  description: 'The VM''s memory as a percentage of the host''s DRAM. The monster size is 40% of DRAM or 256 GB, whichever is smaller; NVMe tiering does not count.'
  meaning: Monster VM (default). DRAM only; NVMe tiering does not count.
  source: knowledge-base
  kb: vsphere/object-types/cluster/models/cluster-risk
  quote: '| Memory | 40% of the host''s DRAM, or 256 GB, whichever is smaller.'
  interval: 5m
- id: idle-vm-cpu
  metric: VM CPU consumption per day (Idle VM policy)
  object: VirtualMachine
  operator: <=
  value: 100
  unit: MHz
  condition: 100% of the time, every day for 7 days; VM older than 30 days
  meaning: Idle VM (VCF Operations policy default).
  source: knowledge-base
  kb: vsphere/technology/cpu/metrics/virtual-motherboard/idle-vm
  quote: '| Within each day it consumes no more than | 100 MHz CPU |'
  interval: 5m
- id: datastore-mission-critical-vm-concentration
  metric: Mission-critical VMs per datastore
  object: Datastore
  operator: <
  value: 250
  unit: count
  meaning: Concentration risk cap (example policy).
  source: knowledge-base
  kb: sp5-framework/capacity/capacity-management
  quote: 'concentration risk: fewer than 250 mission-critical VMs per datastore'
- id: large-vm-fleet-average-cpu-oversized
  metric: Average CPU workload among large VMs (super metric)
  object: VirtualMachine
  operator: <
  value: 20
  unit: '%'
  condition: all month, 5-minute values, group of hundreds of large VMs
  meaning: All large VMs oversized. About 40% indicates correct sizing.
  source: knowledge-base
  kb: sp5-framework/capacity/rightsizing
  quote: '| Average CPU workload among the VMs | About 40% | Below 20% all month: all large VMs oversized |'
  interval: 5m
- id: host-cpu-cores-free
  metric: ESXi Core Utilization
  object: HostSystem
  layer: hypervisor
  operator: <
  value: 100
  unit: '%'
  condition: or ESXi Thread Utilization below 50%
  meaning: Physical cores are still free. New VMs can go on.
  source: knowledge-base
  kb: vsphere/technology/cpu/decision-tree/host-cpu-capacity-headroom
  quote: 'Core Utilization below 100% or Thread Utilization below 50%: physical cores are still free.'
- id: host-cpu-thread-utilization-target
  metric: ESXi Thread Utilization
  object: HostSystem
  layer: hypervisor
  operator: range
  value: 80
  value_high: 90
  unit: '%'
  condition: Core Utilization at 100%
  meaning: Level to keep per host. Cluster level is lower.
  source: knowledge-base
  kb: vsphere/technology/cpu/decision-tree/host-cpu-capacity-headroom
  quote: Keep it around 80%-90% per host
- id: planning-gold-cpu-overcommit
  metric: CPU overcommit ratio
  object: VirtualMachine
  operator: '='
  value: 1
  unit: number
  description: 'The sum of the vCPUs of all running VMs divided by the usable physical threads of the cluster.'
  condition: Gold class of service, planning stage
  meaning: 'Allocation model: vCPU sold per physical thread, against usable threads.'
  source: knowledge-base
  kb: sp5-framework/capacity/class-of-service-planning
- id: planning-gold-memory-overcommit
  metric: Memory overcommit ratio
  object: VirtualMachine
  operator: '='
  value: 1
  unit: number
  description: 'The sum of the configured memory of all running VMs divided by the usable DRAM of the cluster.'
  condition: Gold class of service, planning stage
  meaning: 'Allocation model: VM memory sold per GB of usable DRAM; memory tiering is added on top.'
  source: knowledge-base
  kb: sp5-framework/capacity/class-of-service-planning
- id: planning-gold-cpu-reservation
  metric: CPU reservation ratio
  object: VirtualMachine
  operator: '='
  value: 0.5
  unit: number
  description: 'The share of each VM''s configured vCPU × base GHz reserved at the resource pool.'
  condition: Gold class of service, planning stage
  meaning: 'Reservation model: share of each VM CPU reserved at the resource pool, at the base clock.'
  source: knowledge-base
