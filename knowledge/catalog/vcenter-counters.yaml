  page: 2041
- counter: mem.consumed
  object: Datacenter
  shows: ClusterComputeResource
  chart: Memory (MB)
  label: <cluster>
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Amount of host machine memory used by all powered on virtual machines in the cluster.
  page: 2042
- counter: disk.used
  object: Datacenter
  chart: Space Utilization
  label: Virtual Disks
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  minmax_level: 4
  description: Amount of disk space used by virtual disk files. Virtual disk files store the contents of the virtual machine's hard disk drive. It includes information that you write to a virtual machine's
    hard disk, such as the operating system, program files, and data files.
  page: 2043
