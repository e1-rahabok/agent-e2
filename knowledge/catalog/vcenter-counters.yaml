  chart: CPU (MHz)
  label: <cluster>
  unit: Megahertz (MHz)
  stat_type: Rate
  rollup: Average
  level: 1
  minmax_level: 4
  description: Amount of CPU currently in use by the cluster. The active CPU usage is approximately equal to the ratio of the used CPU cycles to the available CPU cycles. The maximum possible value is the
