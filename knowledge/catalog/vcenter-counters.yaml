meta:
  id: catalog/vcenter-counters
  title: vCenter performance chart counters (vSphere 9.1)
  source:
    document: VMware vSphere 9.1 product documentation (PDF built 2026-11-02; the copyright page carries no revision number)
    path: vSphere Monitoring and Performance > Overview Performance Charts > Clusters, Data centers, Datastores and Datastore Clusters, Hosts, Resource Pools, Virtual Machines > Data Counters tables (pp.
      2032-2111)
  fields:
    counter: group.name. The chart tables print the name only; the group comes from the chart (see review_notes).
    object: Managed object whose chart shows the counter.
    shows: Child objects or instances the chart plots, when not the object itself.
    unit: As printed, spelling normalized.
    rollup: Rollup stored at level.
    level: Statistics level that stores the counter.
    minmax_level: Level that adds Minimum and Maximum rollups.
    page: Page in the source PDF.
    kb: Knowledge file that explains the metric.
  review_notes:
  - 'Whole file: parsed from the Data Counters tables of the vSphere 9.1 documentation; one row per chart row.'
  - 'Field counter: the group prefix (cpu, mem, disk, virtualDisk, datastore, gpu, net) is inferred from the chart that shows the row. Rows without a prefix (deviceLatency, maxQueueDepth, totalReadLatency,
    totalWriteLatency, numberReadAveraged, numberWriteAveraged on the per-VM-disk datastore charts) have an unclear group.'
  - 'Omitted: vApp charts (the documentation describes them with the same counters as resource pools) and Fault Tolerance charts (out of scope).'
  - 'Kept as printed: host and VM network rate labelled Kilobytes per second (Kbps); the VM Virtual Disk Rate rows labelled Read Requests and Write Requests with a KBps unit; cluster Memory Active in kilobytes
    (kb).'
  - 'Field kb: mapping from chart row to knowledge file made by Claude. Rows without kb have no dedicated knowledge file yet.'
  status: draft
rows:
- counter: cpu.usagemhz
  object: ClusterComputeResource
  chart: CPU (MHz)
  label: Usage
  unit: Megahertz (MHz)
  stat_type: Rate
  rollup: Average
  level: 1
  minmax_level: 4
  description: Sum of the average CPU usage values, in Megahertz, of all virtual machines in the cluster.
  page: 2032
- counter: cpu.totalmhz
  object: ClusterComputeResource
  chart: CPU (MHz)
  label: Total
  unit: Megahertz (MHz)
  stat_type: Rate
  rollup: Summation
  level: 1
  description: Total amount of CPU resources available in the cluster. The maximum value is equal to the number of cores multiplied by the frequency of the processors. For example, a cluster has two hosts,
    each of which has four CPUs that are 3 GHz each, and one virtual machine that has two virtual CPUs.
  page: 2032
- counter: cpu.usagemhz
  object: ClusterComputeResource
  shows: HostSystem, ResourcePool, VirtualMachine
  chart: CPU Usage
  label: <host>, <resource pool>, or <virtual machine>
  unit: Megahertz (MHz)
  stat_type: Rate
  rollup: Average
  level: 1
  minmax_level: 4
  description: Amount of CPU actively used by the host, resource pool, or virtual machine in the cluster.
  page: 2033
- counter: disk.usage
  object: ClusterComputeResource
  shows: HostSystem
  chart: Disk (KBps)
  label: <host>
  unit: Kilobytes per second (KBps)
  stat_type: Rate
  rollup: Average
  level: 1
  minmax_level: 4
  description: Average data I/O rate across all hosts in the cluster.
  page: 2034
- counter: mem.consumed
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Consumed
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Amount of host machine memory used by all powered on virtual machines in the cluster. A cluster's consumed memory consists of virtual machine consumed memory and overhead memory. It does
    not include host-specific overhead memory, such as memory used by the service console or VMkernel.
  page: 2036
  kb: vsphere/technology/memory/metrics/cluster/consumed
- counter: mem.totalmb
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Total
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Total amount of machine memory of all hosts in the cluster that is available for virtual machine memory (physical memory for use by the Guest OS) and virtual machine overhead memory.
  page: 2036
- counter: mem.active
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Active
  unit: Kilobytes (kb)
  stat_type: Absolute
  rollup: Average
  level: 2
  minmax_level: 4
  description: Sum of the active guest physical memory of all powered on virtual machines on the host, plus memory used by basic VMkernel applications. Active memory is estimated by the VMkernel.
  page: 2037
- counter: mem.vmmemctl
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Balloon
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Sum of the guest physical memory reclaimed by the balloon driver for all powered on virtual machines on the host.
  page: 2037
- counter: mem.consumed
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Consumed
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Amount of machine memory used on the host. Consumed memory includes virtual machine memory, service console memory, and VMkernel memory. consumed memory = total host memory - free host memory
  page: 2037
  kb: vsphere/technology/memory/metrics/cluster/consumed
- counter: mem.granted
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Granted
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 2
  minmax_level: 4
  description: Sum of the guest physical memory granted for all powered on virtual machines. Granted memory is mapped to the host's machine memory. Granted memory for a host includes the shared memory of
    each virtual machine on the host.
  page: 2037
- counter: mem.swapused
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Swap Used
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 2
  minmax_level: 4
  description: Sum of the memory swapped by all powered on virtual machines on the host.
  page: 2038
- counter: mem.tier.consumed
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Tier memory consumed
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Latest
  level: 2
  description: Amount of machine memory consumed by the host per tier.
  page: 2038
  kb: vsphere/technology/memory/concepts/memory-tiering
- counter: mem.totalmb
  object: ClusterComputeResource
  chart: Memory (MB)
  label: Total
  unit: Megabytes (MB)
  stat_type: Absolute
  rollup: Average
  level: 1
  minmax_level: 4
  description: Aggregate total memory available to the cluster.
  page: 2038
- counter: mem.consumed
  object: ClusterComputeResource
  shows: ResourcePool, VirtualMachine, HostSystem
  chart: Memory Consumed
  label: Resource Pools and Virtual Machines, or Hosts
