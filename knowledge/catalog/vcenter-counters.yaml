  shows: virtual NIC
  chart: Network Rate (Mbps)
  label: Data Transmit Rate
  unit: Kilobytes per second (Kbps)
  stat_type: Rate
  rollup: Average
  level: 2
  minmax_level: 4
  description: Rate at which data is transmitted across each virtual NIC instance on the virtual machine.
  page: 2107
  kb: vsphere/technology/network/metrics/virtual-motherboard/throughput
- counter: net.packetTx
  object: VirtualMachine
  shows: virtual NIC
  chart: Network Packets (Number)
  label: Packets Transmitted
  unit: Number
  stat_type: Absolute
  rollup: Summation
  level: 3
  description: Number of network packets transmitted across the top ten virtual NIC instances on the virtual machine. The chart also displays the aggregated value for each NIC.
  page: 2108
  kb: vsphere/technology/network/metrics/virtual-motherboard/packets
- counter: net.packetRx
  object: VirtualMachine
  shows: virtual NIC
  chart: Network Packets (Number)
  label: Packets Received
  unit: Number
  stat_type: Absolute
  rollup: Summation
  level: 3
  description: Number of network packets received across the top ten virtual NIC instances on the virtual machine. The chart also displays the aggregated value for each NIC.
  page: 2108
  kb: vsphere/technology/network/metrics/virtual-motherboard/packets
- counter: disk.provisioned
  object: VirtualMachine
  chart: Space
  label: Allocated
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  description: Total amount of logical datastore space provisioned by an administrator for the virtual machine. It is the storage size up to which the virtual machine files on datastores can grow. This
    includes log files, VMX files, and other miscellaneous files. Allocated space is not always in use.
  page: 2110
  kb: vsphere/technology/storage/metrics/virtual-motherboard/provisioned-space
- counter: disk.used
  object: VirtualMachine
  chart: Space
  label: Used
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  description: Amount of physical datastore space in use by the virtual machine files.
  page: 2110
  kb: vsphere/technology/storage/metrics/virtual-motherboard/disk-space-used
- counter: disk.unshared
  object: VirtualMachine
  chart: Space
  label: Not Shared
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  description: Amount of datastore space that belongs only to this virtual machine and is not shared with other virtual machines. Only unshared space is guaranteed to be reclaimed for the virtual machine
    if, for example, it is moved to a different datastore and then back again.
  page: 2110
  kb: vsphere/technology/storage/metrics/virtual-motherboard/disk-space-used
- counter: disk.used
  object: VirtualMachine
  shows: Datastore
  chart: Space Utilization by Datastores
  label: <datastore>
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  description: Amount of disk space in the datastore currently in use by the virtual machine.
  page: 2111
  kb: vsphere/technology/storage/metrics/virtual-motherboard/disk-space-used
- counter: disk.used
  object: VirtualMachine
  chart: Space Utilization By File Type
  label: Virtual Disks
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  minmax_level: 4
  description: Amount of disk space used by virtual disk files. Virtual disk files store the contents of the virtual machine's hard disk drive, including information that you write to a virtual machine's
    hard disk - the operating system, program files, and data files.
  page: 2112
  kb: vsphere/technology/storage/concepts/vm-files
- counter: disk.used
  object: VirtualMachine
  chart: Space Utilization By File Type
  label: Swap Files
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  minmax_level: 4
  description: Amount of disk space used by swap files. Swap files back up the virtual machine's physical memory.
  page: 2112
  kb: vsphere/technology/storage/concepts/vm-files
- counter: disk.used
  object: VirtualMachine
  chart: Space Utilization By File Type
  label: Snapshots
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  minmax_level: 4
  description: Amount of disk space used by virtual machine snapshot files. Snapshot files store information about virtual machine snapshots. They include snapshot state files and delta disk files. A snapshot
    state file stores the running state of the virtual machine at the time of the snapshot. It has the extension .vmsn.
  page: 2112
  kb: vsphere/technology/storage/metrics/virtual-motherboard/snapshot-space
- counter: disk.used
  object: VirtualMachine
  chart: Space Utilization By File Type
  label: Other VM Files
  unit: Gigabytes (GB)
  stat_type: Absolute
  rollup: Latest
  level: 1
  minmax_level: 4
  description: Amount of disk space used by all other virtual machine files, such as configuration files and log files.
  page: 2112
  kb: vsphere/technology/storage/concepts/vm-files
