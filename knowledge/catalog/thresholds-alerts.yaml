    match: all
    symptoms: [sym-vm-peak-vcpu-ready-above-32, sym-vm-cpu-ready-above-4, sym-vm-cpu-contention-above-8, sym-vm-cpu-usage-above-1ghz]
  wait_cycles: 1
  source: knowledge-base
  kb: vsphere/object-types/vm/alerts/vm-alerts
- id: alert-esxi-cpu-contention-red
  name: ESXi CPU contention
  criticality: red
  pillar: performance
  object: HostSystem
  match: all
  sets:
  - relation: child
    object: VirtualMachine
    population: '> 25%'
    match: all
    symptoms: [sym-vm-peak-vcpu-ready-above-24, sym-vm-cpu-contention-above-6]
  wait_cycles: 1
  source: knowledge-base
  kb: vsphere/object-types/esxi/alerts/esxi-alerts
- id: alert-resource-pool-cpu-contention-red
  name: Resource pool CPU contention
  criticality: red
