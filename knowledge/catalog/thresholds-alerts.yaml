alerts:
- id: alert-guest-os-cpu-queue-red
  name: Guest OS CPU run queue
  criticality: red
  pillar: performance
  object: VirtualMachine
  match: all
  sets:
  - relation: self
    match: all
    symptoms: [sym-guest-os-cpu-queue-above-20, sym-vm-cpu-net-run-above-75]
  wait_cycles: 3
  source: knowledge-base
  kb: guest-os/system/alerts/guest-os-alerts
- id: alert-guest-os-disk-queue-red
  name: Guest OS disk queue
  criticality: red
  pillar: performance
  object: VirtualMachine
  match: all
  sets:
  - relation: self
    match: all
    symptoms: [sym-guest-os-disk-queue-above-10000, sym-vm-cpu-usage-above-1ghz]
  wait_cycles: 1
  source: knowledge-base
  kb: guest-os/system/alerts/guest-os-alerts
- id: alert-guest-os-disk-queue-orange
  name: Guest OS disk queue
  criticality: orange
  pillar: performance
  object: VirtualMachine
  match: all
  sets:
  - relation: self
    match: all
    symptoms: [sym-guest-os-disk-queue-above-5000, sym-vm-cpu-usage-above-1ghz]
  wait_cycles: 1
  source: knowledge-base
  kb: guest-os/system/alerts/guest-os-alerts
- id: alert-vm-cpu-contention-red
  name: VM CPU contention
  criticality: red
  pillar: performance
  object: VirtualMachine
  match: all
  sets:
  - relation: self
    match: all
    symptoms: [sym-vm-peak-vcpu-ready-above-32, sym-vm-cpu-ready-above-8, sym-vm-cpu-contention-above-8, sym-vm-cpu-usage-above-1ghz]
  wait_cycles: 1
  source: knowledge-base
  kb: vsphere/object-types/vm/alerts/vm-alerts
- id: alert-vm-cpu-contention-orange
  name: VM CPU contention
  criticality: orange
  pillar: performance
