meta:
  id: catalog/thresholds-alerts
  title: 'Alert thresholds: symptoms and alert definitions'
  sections:
    symptoms: 'One test each: object, metric, operator, value, unit. Written once; alerts refer to it by id. A symptom is not an alert.'
    alerts: 'Reactive guard rails, intra-day. One alert definition per object type, alert and criticality: which symptoms, how they combine, on which members, for how long. Independent of the KPI levels. The one place for alert values: the alert files hold the reasons, not the numbers.'
  fields:
    id: Stable key, unique across the threshold files. Symptoms start with sym-, alerts with alert-.
    object: 'Managed object type. An alert has one: an alert fires on one object type. A symptom with a list is one definition per type in VCF Operations.'
    layer: Layer that produces the metric.
    metric: Metric as the knowledge file names it.
    interval: 20s (20-second peak), 5m (5-minute average), 2s (esxtop), 1d; empty until a source states it.
    operator: '>, >=, <, <=, =.'
    value: The number compared against.
    unit: 'Unit of value. count for a number of things (threads, I/Os, packets, VMs, vCPU): the VCF Operations unit. Blank for a ratio or fraction: what it is a ratio of is in the metric name.'
    role: 'issue (default): the problem itself. gate: not a problem; keeps the alert off idle objects (CPU Usage above 1 GHz, IOPS above 100).'
    source: 'knowledge-base, or a vendor document with its version: vsphere-9.1-docs, performance-best-practices-9.1, microsoft. Vendor values can go stale; the newer official document wins.'
    kb: 'Alert: the alert file of its object type (<object>/alerts/<object>-alerts): why each symptom is in the alert, who receives it, which flow to open. Symptom: the file of the metric it tests. No quote: the files hold no alert values.'
    name: 'The alert as a ## heading of its kb file names it (lint checks it); red and orange of one alert share the name.'
    criticality: red (VCF Operations Critical) or orange (Immediate). No yellow alert.
    pillar: performance or capacity. A capacity alert means a bug or a hardware availability issue took capacity away.
    match: 'all or any: how the symptom sets of the alert combine.'
    sets: 'Symptom sets. relation: self (the alert object) or child (its children of type object, with population, the share of them that must match, > 25% or >= 50%). match: all or any, inside the set. symptoms: ids.'
    wait_cycles: 'Collection cycles (5 minutes) the sets must hold before the alert fires. 1 when the source states no wait.'

  review_notes:
  - 'To do (project/design-thresholds.md, section 9): cancel cycles, once approved. Today every symptom and alert clears after 1 cycle.'
  - 'To check: wait cycles sit on the alert, as the source states them ("for 15 minutes, all of"). Broadcom advises the delay on the symptom (Alert Definition Best Practices, techdocs.broadcom.com); a shared symptom (CPU Usage above 1 GHz) is used with different waits, so moving it means one symptom per wait.'
  - 'ESXi, resource pool and cluster CPU contention: a share of the member VMs (relation child, VirtualMachine, > 25%), as the source states for the infrastructure CPU alert. For the cluster, VMs are descendants (through hosts) in VCF Operations, not direct children; check when the VCF Operations alert definitions are built (after 1.0).'
  - 'ESXi, resource pool and cluster memory contention: tested on the object itself until Q145 (c) says whether they also read a share of the member VMs.'
  status: draft
