<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="1000" height="880" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111" text-anchor="start">Agent E2: one question through six stages</text>
<text x="24" y="54" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">Code decides the route. The model reads in stages 1 and 5 and may run once more in stage 6.</text>
<rect x="651.5" y="66" width="14" height="14" rx="3" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="671.5" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Agent code</text>
<rect x="756.5" y="66" width="14" height="14" rx="3" fill="#fdebd3" stroke="#c25e00" stroke-width="1.4"/>
<text x="776.5" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Model call</text>
<rect x="861.5" y="66" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="881.5" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Input or output</text>
<rect x="260" y="100" width="460" height="52" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="270" y="119" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Question and images</text>
<text x="270" y="138" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Input: the question text and its screenshots.</text>
<rect x="260" y="190" width="460" height="70" rx="6" fill="#fdebd3" stroke="#c25e00" stroke-width="1.4"/>
<text x="270" y="209" font-size="13" font-weight="bold" fill="#4a2400" text-anchor="start">1 Understand</text>
<text x="270" y="228" font-size="11.5" font-weight="normal" fill="#4a2400" text-anchor="start">Model (1 call): reads the question into a</text>
<text x="270" y="243" font-size="11.5" font-weight="normal" fill="#4a2400" text-anchor="start">fixed schema. The agent resolves names.</text>
<rect x="260" y="290" width="460" height="70" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="270" y="309" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">2 Plan</text>
<text x="270" y="328" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Agent: builds the reading set from the</text>
<text x="270" y="343" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">knowledge base's map. No model call.</text>
<rect x="260" y="390" width="460" height="70" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="270" y="409" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">3 Compute</text>
<text x="270" y="428" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Agent: catalog, calculator, flow executor,</text>
<text x="270" y="443" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">planning calculator on the case.</text>
<rect x="260" y="490" width="460" height="70" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="270" y="509" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">4 Ask?</text>
<text x="270" y="528" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Agent rule: does a missing fact</text>
<text x="270" y="543" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">change the answer?</text>
<rect x="740" y="475" width="240" height="86" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="750" y="494" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">One clarifying round</text>
<text x="750" y="513" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">A missing fact changes</text>
<text x="750" y="528" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">the answer. One round,</text>
<text x="750" y="543" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">then back to stage 1.</text>
<rect x="260" y="590" width="460" height="70" rx="6" fill="#fdebd3" stroke="#c25e00" stroke-width="1.4"/>
<text x="270" y="609" font-size="13" font-weight="bold" fill="#4a2400" text-anchor="start">5 Answer</text>
<text x="270" y="628" font-size="11.5" font-weight="normal" fill="#4a2400" text-anchor="start">Model (1 call, n with consensus): reads</text>
<text x="270" y="643" font-size="11.5" font-weight="normal" fill="#4a2400" text-anchor="start">and writes the draft answer.</text>
<rect x="260" y="690" width="460" height="70" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="270" y="709" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">6 Check</text>
<text x="270" y="728" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Agent: verifier, consensus, coverage.</text>
<text x="270" y="743" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">A gap follow-up or repair may call the model.</text>
<rect x="260" y="790" width="460" height="52" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="270" y="809" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Answer with citations</text>
<text x="270" y="828" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Computed facts and citations to the files.</text>
<path d="M 490 152 L 490 188" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 490 260 L 490 288" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 490 360 L 490 388" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 490 460 L 490 488" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 720 525 L 738 525" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 860 475 L 860 225 L 722 225" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 490 560 L 490 588" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="496" y="567" width="20" height="15" fill="#ffffff" opacity="0.92"/>
<text x="506" y="578" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">no</text>
<path d="M 490 660 L 490 688" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 490 760 L 490 788" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 260 725 L 200 725 L 200 325 L 258 325" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="29" y="509" width="179" height="15" fill="#ffffff" opacity="0.92"/>
<text x="118" y="520" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">gap: a named metric not read</text>
</svg>
