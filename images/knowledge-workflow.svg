<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="1800" height="600" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111" text-anchor="start">From expertise to knowledge the model reads</text>
<text x="24" y="54" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">Five stages. A wrong answer is traced to its cause and fixed at the source.</text>
<rect x="1165.9" y="66" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="1185.9" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Source or other system</text>
<rect x="1346.5" y="66" width="14" height="14" rx="3" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="1366.5" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Knowledge</text>
<rect x="1445.2" y="66" width="14" height="14" rx="3" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="1465.2" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Check or proof</text>
<rect x="1575.4" y="66" width="14" height="14" rx="3" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1595.4" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Agent and harness</text>
<rect x="1724.5" y="66" width="14" height="14" rx="3" fill="#fdebd3" stroke="#c25e00" stroke-width="1.4"/>
<text x="1744.5" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Model</text>
<rect x="30" y="100" width="280" height="420" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="42" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">1  Sources</text>
<rect x="350" y="100" width="260" height="420" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="362" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">2  Source note</text>
<text x="362" y="138" font-size="11" font-weight="normal" fill="#555" text-anchor="start">project/sources/</text>
<rect x="650" y="100" width="320" height="420" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="662" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">3  Codify</text>
<text x="662" y="138" font-size="11" font-weight="normal" fill="#555" text-anchor="start">One form per kind, one home per fact</text>
<rect x="1010" y="100" width="310" height="420" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="1022" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">4  Check</text>
<rect x="1360" y="100" width="410" height="420" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="1372" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">5  Used by the AI</text>
<rect x="42" y="156" width="256" height="100" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="52" y="175" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Books, spreadsheets, diagrams</text>
<text x="52" y="194" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">The author's own material.</text>
<rect x="42" y="274" width="256" height="100" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="52" y="293" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Documentation</text>
<text x="52" y="312" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Manuals, white papers, expert answers.</text>
<rect x="42" y="392" width="256" height="100" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="52" y="411" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Environment</text>
<text x="52" y="430" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Screenshots, API, GUI, lab tests.</text>
<rect x="362" y="156" width="236" height="150" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="372" y="175" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">One note per topic</text>
<text x="372" y="194" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">A few pages. Each claim about</text>
<text x="372" y="209" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">vendor behaviour, and each</text>
<text x="372" y="224" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">measured number, is tied to its</text>
<text x="372" y="239" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">evidence.</text>
<rect x="662" y="156" width="296" height="100" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="672" y="175" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start">Markdown</text>
<text x="672" y="194" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">Mechanisms, misconceptions, flows.</text>
<rect x="662" y="274" width="296" height="100" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="672" y="293" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start">Catalog YAML</text>
<text x="672" y="312" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">Counters, thresholds, object model.</text>
<rect x="662" y="392" width="296" height="100" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="672" y="411" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start">Tags and links</text>
<text x="672" y="430" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">The expert's map: which files are</text>
<text x="672" y="445" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">read together.</text>
<rect x="1022" y="156" width="286" height="100" rx="6" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="1032" y="175" font-size="13" font-weight="bold" fill="#2a1650" text-anchor="start">Lint</text>
<text x="1032" y="194" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">On every merge.</text>
<rect x="1022" y="274" width="286" height="100" rx="6" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="1032" y="293" font-size="13" font-weight="bold" fill="#2a1650" text-anchor="start">Retrieval check and benchmark</text>
<text x="1032" y="312" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Are the right files found, and</text>
<text x="1032" y="327" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">does the whole system answer</text>
<text x="1032" y="342" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">correctly?</text>
<rect x="1022" y="392" width="286" height="100" rx="6" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="1032" y="411" font-size="13" font-weight="bold" fill="#2a1650" text-anchor="start">Author review</text>
<text x="1032" y="430" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Status reviewed: the gate of release 1.0.</text>
<rect x="1372" y="156" width="386" height="100" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1382" y="175" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Agent and harness</text>
<text x="1382" y="194" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Five paths to the model.</text>
<rect x="1372" y="296" width="386" height="100" rx="6" fill="#fdebd3" stroke="#c25e00" stroke-width="1.4"/>
<text x="1382" y="315" font-size="13" font-weight="bold" fill="#4a2400" text-anchor="start">Model</text>
<text x="1382" y="334" font-size="11.5" font-weight="normal" fill="#4a2400" text-anchor="start">Reads, applies and answers with citations.</text>
<path d="M 1565 256 L 1565 296" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 312 315 L 348 315" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 612 315 L 648 315" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 972 315 L 1008 315" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 1322 315 L 1358 315" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1374" y="470" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Drafts are served with their status.</text>
<text x="1374" y="485" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Release 1.0 ships only reviewed files.</text>
<path d="M 1565 520 L 1565 580 L 480 580 L 480 522" fill="none" stroke="#1f5fae" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="761" y="565" width="478" height="15" fill="#ffffff" opacity="0.92"/>
<text x="1000" y="576" font-size="10.5" font-weight="normal" fill="#1f5fae" text-anchor="middle">a wrong answer is traced to a missing fact, a retrieval miss or a model error</text>
</svg>
