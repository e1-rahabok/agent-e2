<text x="650" y="400" font-size="10.5" font-weight="normal" fill="#1f5fae" text-anchor="middle">filters</text>
<path d="M 360 432 L 980 432 L 980 292 L 1038 292" fill="none" stroke="#1f5fae" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="631" y="417" width="38" height="15" fill="#ffffff" opacity="0.92"/>
<text x="650" y="428" font-size="10.5" font-weight="normal" fill="#1f5fae" text-anchor="middle">links</text>
<path d="M 360 460 L 1020 460 L 1020 382 L 1038 382" fill="none" stroke="#1f5fae" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="582" y="445" width="136" height="15" fill="#ffffff" opacity="0.92"/>
<text x="650" y="456" font-size="10.5" font-weight="normal" fill="#1f5fae" text-anchor="middle">marked misconceptions</text>
