<rect x="520" y="312" width="400" height="60" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="530" y="331" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Not indexed</text>
<text x="530" y="350" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Removed: the numbered steps carry the flow.</text>
<path d="M 360 328 L 518 328" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="1040" y="134" width="300" height="70" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1050" y="153" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Search</text>
<text x="1050" y="172" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Chunks, and filters from the tags.</text>
<path d="M 920 170 L 1038 170" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="1040" y="262" width="300" height="60" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1050" y="281" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Reading plan</text>
<text x="1050" y="300" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Follows the links.</text>
<rect x="1040" y="352" width="300" height="60" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1050" y="371" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Up-front block</text>
<text x="1050" y="390" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Sent with every question.</text>
<rect x="1040" y="442" width="300" height="60" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1050" y="461" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Review only</text>
<text x="1050" y="480" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start">Never embedded.</text>
<path d="M 360 404 L 940 404 L 940 190 L 1038 190" fill="none" stroke="#1f5fae" stroke-width="1.5" marker-end="url(#ah)"/>
