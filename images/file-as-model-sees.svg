<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="1500" height="580" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111" text-anchor="start">What the model sees of a file</text>
<text x="24" y="54" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">A ## section is the unit of retrieval. Metadata is read by code and never embedded.</text>
<rect x="1044.4" y="66" width="14" height="14" rx="3" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="1064.4" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Part of a knowledge file</text>
<rect x="1237.6000000000001" y="66" width="14" height="14" rx="3" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="1257.6000000000001" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Harness</text>
<rect x="1323.7" y="66" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="1.4"/>
<text x="1343.7" y="78" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">Not used by the model</text>
<rect x="30" y="100" width="340" height="440" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="42" y="122" font-size="14" font-weight="bold" fill="#222" text-anchor="start">One knowledge file</text>
<rect x="42" y="134" width="316" height="44" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="52" y="153" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace"># Title</text>
<rect x="42" y="188" width="316" height="44" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="52" y="207" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">## Sections</text>
<rect x="42" y="242" width="316" height="44" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="52" y="261" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">## Misconceptions</text>
<rect x="42" y="296" width="316" height="44" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="52" y="315" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Mermaid chart</text>
<rect x="42" y="354" width="316" height="174" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="52" y="373" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">## Metadata (yaml, last)</text>
<text x="56" y="404" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">tags</text>
<text x="56" y="432" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">links</text>
<text x="56" y="460" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">up_front</text>
<text x="56" y="488" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">status, source, review_notes, corrections</text>
<rect x="520" y="134" width="400" height="152" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="530" y="153" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Chunks</text>
<text x="530" y="172" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">One chunk per ## section. Each chunk starts</text>
<text x="530" y="187" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">with Title (id) &gt; Heading.</text>
